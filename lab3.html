<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>prove you are not a bot</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 960px;
            margin: 20px auto;
            padding: 0 16px;
        }

        #checks li {
            margin: 4px 0;
        }

        #result {
            margin-top: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Prove You Are Not A Bot</h1>
    <p>只有指定的瀏覽器才能看到 flag：</p>
    <ul>
        <li>User-Agent 必須是 <code>HackSirCrawler/3.0</code></li>
        <li><code>navigator.webdriver</code> 必須是 <code>false</code></li>
        <li>必須帶有 cookie <code>hacksir_pass=owo_lab3</code></li>
    </ul>
    <ul id="checks"></ul>
    <div id="result"></div>

    <script>
        (function () {
            const k = 0x5A;
            const d = [18, 59, 57, 49, 9, 51, 40, 33, 52, 106, 46, 5, 59, 5, 40, 106, 56, 106, 46, 5, 107, 5, 41, 45, 105, 59, 40, 39];
            const result = document.getElementById('result');
            const list = document.getElementById('checks');

            const cookies = Object.fromEntries(
                document.cookie.split(';').map(s => s.trim()).filter(Boolean).map(s => {
                    const i = s.indexOf('=');
                    return [s.slice(0, i), s.slice(i + 1)];
                })
            );

            const checks = [
                ['User-Agent', navigator.userAgent === 'HackSirCrawler/3.0'],
                ['navigator.webdriver', navigator.webdriver === false],
                ['cookie', cookies['hacksir_pass'] === 'owo_lab3'],
            ];

            checks.forEach(([name, ok]) => {
                const li = document.createElement('li');
                li.textContent = (ok ? '✔ ' : '✘ ') + name;
                list.appendChild(li);
            });

            result.textContent = checks.every(c => c[1])
                ? String.fromCharCode(...d.map(c => c ^ k))
                : 'you are a bot';
        })();
    </script>
</body>

</html>
