<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>軟爛胡言</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2l4 3h4l4-3v8l-6 5-6-5z' fill='%2385c8dd'/%3E%3Ccircle cx='5.6' cy='8' r='1.5' fill='%23323e87'/%3E%3Ccircle cx='10.4' cy='8' r='1.5' fill='%23323e87'/%3E%3C/svg%3E">
  <meta name="description" content="一隻可以拉扯、搖晃、切開、火烤、敲打、開槍的軟體胡言，果凍、橡膠、保麗龍、金屬任選——四面體 XPBD 物理模擬與 WebGPU／WebGL2 渲染。">
  <link rel="stylesheet" href="css/style.css?v=20261025a">
</head>

<body>
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="互動式 3D 胡言。" role="img"></canvas>
    <svg class="stroke" id="stroke" aria-hidden="true">
      <line id="strokeLine" x1="0" y1="0" x2="0" y2="0" />
    </svg>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="bonk" id="bonk" aria-hidden="true">BONK</div>
    <div class="fallback" id="fallback" hidden>
      <div>
        <span class="kicker">渲染器離線</span>
        <h2 id="fallbackTitle">這個標本需要 WebGPU。</h2>
        <p id="fallbackDetail"></p>
      </div>
    </div>
  </div>

  <header class="masthead">
    <h1><span>軟爛</span><span>胡言</span></h1>
    <p class="caption">如果你看扁我，我就扁扁地走開。<br>如果你小看我，我就小小地走開。<br>如果你惹毛我，我就毛毛地走開。</p>
  </header>

  <aside class="panel" aria-label="標本控制">
    <div class="group">
      <span class="label">工具</span>
      <div class="tools" role="group" aria-label="工具">
        <button class="tool" type="button" data-tool="hand" aria-pressed="true" title="拖曳拉扯（1）"><svg viewBox="0 0 20 20"
            aria-hidden="true">
            <path
              d="M6 10V5.5a1.2 1.2 0 0 1 2.4 0V9m0-4.8V3.8a1.2 1.2 0 0 1 2.4 0V9m0-4.2a1.2 1.2 0 0 1 2.4 0V9.5m0-3a1.2 1.2 0 0 1 2.4 0V12c0 3.3-2.4 5.5-5.4 5.5-2.2 0-3.6-1-4.8-2.8L3.3 11.6a1.3 1.3 0 0 1 2-1.6L6 11" />
          </svg>手</button>
        <button class="tool" type="button" data-tool="knife" aria-pressed="false" title="劃過去切開（2）"><svg viewBox="0 0 20 20"
            aria-hidden="true">
            <path d="M3 17l9.2-9.2M12.2 7.8l3.6-4.3c.8 1.6.3 4-1.4 5.7L12.6 11 9 7.4" />
            <path d="M3 17l2.6-.6" />
          </svg>刀</button>
        <button class="tool" type="button" data-tool="torch" aria-pressed="false" aria-label="火焰噴槍"
          title="按住噴火（3）"><svg
            viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.2 12.8l4 4 2.6-2.6-4-4zM7.8 12.2l3.4-3.4" />
            <path d="M11.6 8.4c-.4-2.2 1.3-3.6 4.2-5.4.5 2.9.1 5-1.4 6-1 .7-2.4.4-2.8-.6z" />
          </svg>噴槍</button>
        <button class="tool" type="button" data-tool="hammer" aria-pressed="false" title="點一下敲下去（4）"><svg viewBox="0 0 20 20"
            aria-hidden="true">
            <path d="M3.5 16.5l7.6-7.6M9.6 5.6l4.8 4.8 2.6-2.6-4.8-4.8z" />
          </svg>鎚子</button>
        <button class="tool" type="button" data-tool="bat" aria-pressed="false" aria-label="棒球棍"
          title="點一下揮棒（5）"><svg
            viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3.4 15.4l1.2 1.2M4.6 14.6L12.4 6c1.1-1.2 2.9-1.4 3.9-.4s.8 2.8-.4 3.9l-8.6 7.8" />
          </svg>球棒</button>
        <button class="tool" type="button" data-tool="gun" aria-pressed="false" title="點一下連開三槍（6）"><svg viewBox="0 0 20 20"
            aria-hidden="true">
            <path d="M4 5.8h12.2v3.2h-5.4c0 1.6-.9 2.5-2.4 2.5H7.7l-.8 4.3H3.6l1.3-6.8H4z" />
          </svg>手槍</button>
      </div>
    </div>
    <div class="group">
      <span class="label">造型</span>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="造型"></div>
    </div>
    <div class="group">
      <span class="label">材質</span>
      <div class="mats" id="materials" role="radiogroup" aria-label="材質"></div>
    </div>
    <div class="group">
      <div class="slider">
        <div class="row"><label class="label" for="firmness">硬度</label><output id="firmnessOut"
            for="firmness">0.40</output></div>
        <input type="range" id="firmness" min="0" max="100" step="1" value="40">
        <div class="ends"><span>軟顫</span><span>凝固</span></div>
      </div>
      <div class="slider">
        <div class="row"><label class="label" for="damping">內部阻尼</label><output id="dampingOut"
            for="damping">0.45</output></div>
        <input type="range" id="damping" min="0" max="100" step="1" value="45">
        <div class="ends"><span>活潑</span><span>黏稠</span></div>
      </div>
    </div>
    <div class="group">
      <div class="buttons">
        <button class="btn" id="flashbang" type="button">閃光彈</button>
        <button class="btn" id="reset" type="button">重置</button>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="slow"><span class="box" aria-hidden="true"></span>¼ 速度</label>
        <label class="check"><input type="checkbox" id="mesh"><span class="box" aria-hidden="true"></span>顯示網格</label>
        <label class="check"><input type="checkbox" id="sound" checked><span class="box"
            aria-hidden="true"></span>音效</label>
      </div>
      <button class="btn wide" id="pause" type="button" aria-pressed="false">暫停</button>
    </div>
  </aside>

  <section class="readouts" aria-label="即時數據">
    <dl class="stats">
      <div>
        <dt class="label">質量</dt>
        <dd>≈<span id="massOut">—</span><small>g</small></dd>
      </div>
      <div>
        <dt class="label">體積</dt>
        <dd><span id="volOut">—</span><small>% 靜止體積</small></dd>
      </div>
      <div>
        <dt class="label">動能</dt>
        <dd><span id="keOut">—</span><small>µJ</small></dd>
      </div>
      <div>
        <dt class="label">塊數</dt>
        <dd><span id="piecesOut">1</span></dd>
      </div>
    </dl>
  </section>

  <div class="scroll-hint" id="scrollHint" aria-hidden="true"><svg viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6" />
    </svg></div>

  <div class="flash" id="flash" aria-hidden="true"><img src="flashbang.png" alt=""></div>

  <script src="fox-data.js?v=20261025b"></script>
  <!-- plain scripts sharing one scope, in dependency order (no modules: they do not load from file://) -->
  <script src="js/geometry.js?v=20261025a"></script>
  <script src="js/knife.js?v=20261025a"></script>
  <script src="js/tools.js?v=20261025a"></script>
  <script src="js/pieces.js?v=20261025a"></script>
  <script src="js/physics.js?v=20261025a"></script>
  <script src="js/shaders.js?v=20261025a"></script>
  <script src="js/shaders-gl.js?v=20261025a"></script>
  <script src="js/materials.js?v=20261025a"></script>
  <script src="js/particles.js?v=20261025a"></script>
  <script src="js/sound.js?v=20261025a"></script>
  <script src="js/renderer.js?v=20261025a"></script>
  <script src="js/renderer-gl.js?v=20261025a"></script>
  <script src="js/main.js?v=20261025a"></script>
</body>

</html>
