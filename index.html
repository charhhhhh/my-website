const WGSL_COMMON = /* wgsl */`
struct U {
  viewProj: mat4x4f,
  view: mat4x4f,
  invViewProj: mat4x4f,
  lightVP: mat4x4f,
  topVP: mat4x4f,
  camPos: vec4f,     // xyz, w = time
  camFwd: vec4f,
  keyDir: vec4f,     // xyz toward light, w = intensity
  screen: vec4f,     // w, h, 1/w, 1/h
  art: vec4f,        // where the drawing sits in the rest plane: origin (u, w), 1 / size
  jelly: vec4f,      // absorption strength, milkiness, albedo gain, unused
  misc: vec4f,       // exposure, meshAlpha, floorY, unused
  bg: vec4f,
  shadowTint: vec4f,
};

const PI = 3.14159265;

fn hash3(p: vec3f) -> f32 {
  var q = fract(p * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
fn vnoise(p: vec3f) -> f32 {
  let i = floor(p); let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let a = mix(mix(hash3(i + vec3f(0,0,0)), hash3(i + vec3f(1,0,0)), u.x), mix(hash3(i + vec3f(0,1,0)), hash3(i + vec3f(1,1,0)), u.x), u.y);
  let b = mix(mix(hash3(i + vec3f(0,0,1)), hash3(i + vec3f(1,0,1)), u.x), mix(hash3(i + vec3f(0,1,1)), hash3(i + vec3f(1,1,1)), u.x), u.y);
  return mix(a, b, u.z);
}
fn fbm(p: vec3f) -> f32 {
  return 0.55 * vnoise(p) + 0.3 * vnoise(p * 2.13 + 7.1) + 0.15 * vnoise(p * 4.37 + 3.3);
}

// rounded rectangle softbox seen along direction d
fn softbox(d: vec3f, c: vec3f, up: vec3f, size: vec2f, blur: f32) -> f32 {
  let cd = dot(d, c);
  if (cd <= 0.0) { return 0.0; }
  let t1 = normalize(cross(up, c));
  let t2 = cross(c, t1);
  let uv = vec2f(dot(d, t1), dot(d, t2)) / cd;
  let q = abs(uv) - size;
  let sd = length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0) - 0.04;
  return 1.0 - smoothstep(-blur, blur, sd);
}

// procedural photo studio: pale cyclorama, overhead softbox, back-left strip, front-right fill card
fn studioEnv(d: vec3f, rough: f32, bg: vec3f) -> vec3f {
  let b = 0.012 + rough * 0.55;
  let y = d.y;
  var col = mix(bg * 0.62, bg * 1.05, smoothstep(-0.35, 0.25, y));
  // the bright paper sweep near the horizon gives vertical walls something to reflect
  col += bg * 0.55 * (1.0 - smoothstep(0.0, 0.3, abs(y + 0.08)));
  col = mix(col, bg * 0.8, smoothstep(0.3, 1.0, y));
  col += vec3f(1.0, 0.985, 0.96) * 3.2 * softbox(d, normalize(vec3f(0.05, 1.0, -0.15)), vec3f(0.0, 0.0, 1.0), vec2f(0.55, 0.32), b);
  col += vec3f(1.0, 0.98, 0.95) * 3.0 * softbox(d, normalize(vec3f(-0.42, 0.34, -0.8)), vec3f(0.0, 1.0, 0.0), vec2f(0.7, 0.06), b);
  col += vec3f(1.0, 0.97, 0.93) * 4.0 * softbox(d, normalize(vec3f(-0.8, 0.38, -0.2)), vec3f(0.0, 1.0, 0.0), vec2f(0.08, 0.55), b);
  col += vec3f(0.95, 0.97, 1.0) * 1.2 * softbox(d, normalize(vec3f(0.85, 0.3, 0.55)), vec3f(0.0, 1.0, 0.0), vec2f(0.45, 0.5), b * 1.3);
  return col;
}

fn ggx(N: vec3f, V: vec3f, L: vec3f, rough: f32) -> f32 {
  let H = normalize(V + L);
  let a = max(rough * rough, 0.002);
  let a2 = a * a;
  let NdH = max(dot(N, H), 0.0);
  let NdL = max(dot(N, L), 0.0);
  let NdV = max(dot(N, V), 1e-3);
  let dd = NdH * NdH * (a2 - 1.0) + 1.0;
  let D = a2 / (PI * dd * dd);
  let k = a * 0.5;
  let G = (NdL / (NdL * (1.0 - k) + k)) * (NdV / (NdV * (1.0 - k) + k));
  return D * G / max(4.0 * NdL * NdV, 1e-3) * NdL;
}

fn linearDepth(p: vec3f) -> f32 { return dot(p - u.camPos.xyz, u.camFwd.xyz); }
`;

const WGSL_DEPTH = /* wgsl */`
@group(0) @binding(0) var<uniform> m: mat4x4f;
@vertex fn vs(@location(0) p: vec3f) -> @builtin(position) vec4f { return m * vec4f(p, 1.0); }
`;

// ── scene: background / floor with soft shadows, then bubbles and the knife ──
const WGSL_SCENE = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var shadowMap: texture_depth_2d;
@group(0) @binding(2) var heightMap: texture_depth_2d;
@group(0) @binding(3) var cmp: sampler_comparison;

struct FSOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };
@vertex fn vsFull(@builtin(vertex_index) i: u32) -> FSOut {
  var o: FSOut;
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  o.pos = vec4f(p, 0.0, 1.0); o.ndc = p; return o;
}

var<private> POISSON: array<vec2f, 16> = array<vec2f, 16>(
  vec2f(-0.94201624, -0.39906216), vec2f(0.94558609, -0.76890725), vec2f(-0.094184101, -0.92938870), vec2f(0.34495938, 0.29387760),
  vec2f(-0.91588581, 0.45771432), vec2f(-0.81544232, -0.87912464), vec2f(-0.38277543, 0.27676845), vec2f(0.97484398, 0.75648379),
  vec2f(0.44323325, -0.97511554), vec2f(0.53742981, -0.47373420), vec2f(-0.26496911, -0.41893023), vec2f(0.79197514, 0.19090188),
  vec2f(-0.24188840, 0.99706507), vec2f(-0.81409955, 0.91437590), vec2f(0.19984126, 0.78641367), vec2f(0.14383161, -0.14100790));

fn keyShadow(P: vec3f) -> f32 {
  let lp = u.lightVP * vec4f(P, 1.0);
  let uv = vec2f(lp.x * 0.5 + 0.5, 0.5 - lp.y * 0.5);
  let z = lp.z;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) { return 1.0; }
  // blocker search → penumbra size (PCSS-lite)
  let dims = vec2f(textureDimensions(shadowMap));
  var blk = 0.0; var nb = 0.0;
  for (var i = 0; i < 16; i++) {
    let s = uv + POISSON[i] * 0.02;
    let d = textureLoad(shadowMap, vec2i(clamp(s, vec2f(0.0), vec2f(0.999)) * dims), 0);
    if (d < z - 0.002) { blk += d; nb += 1.0; }
  }
  if (nb < 0.5) { return 1.0; }
  blk /= nb;
  let pen = clamp((z - blk) * 0.45, 0.003, 0.022);
  var sum = 0.0;
  let rot = hash3(P * 91.7) * 6.2831;
  let cs = vec2f(cos(rot), sin(rot));
  for (var i = 0; i < 16; i++) {
    let o = POISSON[i];
    let r = vec2f(o.x * cs.x - o.y * cs.y, o.x * cs.y + o.y * cs.x);
    sum += textureSampleCompareLevel(shadowMap, cmp, uv + r * pen, z - 0.0015);
  }
  return sum / 16.0;
}

fn contactAO(P: vec3f) -> f32 {
  let tp = u.topVP * vec4f(P, 1.0);
  let uv = vec2f(tp.x * 0.5 + 0.5, 0.5 - tp.y * 0.5);
  let dims = vec2f(textureDimensions(heightMap));
  var occ = 0.0;
  // heightmap depth encodes y linearly over [-1, 4]
  for (var ring = 0; ring < 3; ring++) {
    let rad = 0.012 + f32(ring) * 0.028;
    for (var i = 0; i < 8; i++) {
      let a = f32(i) * 0.785398 + f32(ring) * 0.39;
      let s = uv + vec2f(cos(a), sin(a)) * rad;
      if (s.x < 0.0 || s.x > 1.0 || s.y < 0.0 || s.y > 1.0) { continue; }
      let d = textureLoad(heightMap, vec2i(s * dims), 0);
      let h = d * 5.0 - 1.0;
      if (d < 0.9999) {
        let dist = f32(ring) * 0.028 * 5.2 + 0.05;
        occ += (1.0 - smoothstep(0.0, 0.55 + dist, h)) * (1.0 - f32(ring) * 0.22);
      }
    }
  }
  return clamp(occ / 16.0, 0.0, 1.0);
}

struct BgOut { @location(0) c: vec4f };
@fragment fn fsBackground(i: FSOut) -> BgOut {
  let a = u.invViewProj * vec4f(i.ndc, 0.0, 1.0);
  let b = u.invViewProj * vec4f(i.ndc, 1.0, 1.0);
  let ro = a.xyz / a.w;
  let rd = normalize(b.xyz / b.w - ro);
  var col = u.bg.rgb;
  var dep = 1000.0;
  // slight falloff above the horizon, like a paper sweep lit from above
  col *= 1.0 - 0.08 * smoothstep(0.0, 0.6, rd.y);
  if (rd.y < -1e-4) {
    let t = (u.misc.z - ro.y) / rd.y;
    let P = ro + rd * t;
    dep = linearDepth(P);
    let sh = keyShadow(P);
    let ao = contactAO(P);
    // translucent jelly casts a tinted shadow; contact occlusion stays neutral
    let shadowCol = mix(vec3f(1.0), u.shadowTint.rgb, 1.0 - sh);
    var fl = u.bg.rgb * (0.9 + 0.1 * clamp(1.0 - length(P.xz - vec2f(0.0, 0.8)) * 0.12, 0.0, 1.0));
    fl *= shadowCol;
    fl *= 1.0 - ao * 0.72;
    let fade = smoothstep(7.0, 22.0, t);
    col = mix(fl, col, fade);
  }
  var o: BgOut; o.c = vec4f(col, dep); return o;
}

struct VIn { @location(0) p: vec3f, @location(1) n: vec3f, @location(2) rest: vec3f, @location(3) mat: f32 };
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) rest: vec3f, @location(3) mat: f32 };
@vertex fn vsMesh(v: VIn) -> VOut {
  var o: VOut;
  o.pos = u.viewProj * vec4f(v.p, 1.0);
  o.wp = v.p; o.n = v.n; o.rest = v.rest; o.mat = v.mat;
  return o;
}

@fragment fn fsProps(i: VOut) -> BgOut {
  let N = normalize(i.n);
  let V = normalize(u.camPos.xyz - i.wp);
  let NdV = max(dot(N, V), 1e-3);
  let L = u.keyDir.xyz;
  var col: vec3f;
  if (i.mat > 2.8 && i.mat < 4.5) {
    // knife steel: a product-shot gradient (dark board below, bright sweep above) across the blade,
    // brushed along its length, a lighter satin bevel at the edge and a polished bolster
    let bevel = 1.0 - smoothstep(3.05, 3.4, i.mat);
    let bolster = smoothstep(3.55, 3.65, i.mat);
    let brush = vnoise(vec3f(i.rest.x * 3.0, i.rest.y * 260.0, i.rest.z * 40.0));
    let rough = mix(mix(0.12 + 0.06 * brush, 0.22, bevel), 0.06, bolster);
    let F0 = vec3f(0.56, 0.57, 0.585);
    let fres = F0 + (vec3f(1.0) - F0) * pow(1.0 - NdV, 5.0);
    let R = reflect(-V, N);
    let hz = R.y * 0.8 + (i.rest.y / 0.63 - 0.45) * 1.1 + 0.28 + (brush - 0.5) * 0.06;
    let sweep = smoothstep(-0.35, 0.45, hz);
    var env = mix(vec3f(0.045, 0.047, 0.05), vec3f(0.5, 0.51, 0.53), sweep);
    // the studio's softboxes still show up as crisp streaks
    env += max(studioEnv(R, rough, u.bg.rgb) - u.bg.rgb * 1.15, vec3f(0.0)) * 0.9;
    env *= 0.92 + 0.16 * brush;
    let spec = ggx(N, V, L, max(rough, 0.1)) * u.keyDir.w;
    col = env * fres + fres * spec * 0.5 + vec3f(0.02) * max(dot(N, L), 0.0);
    col = mix(col, col * 0.85 + vec3f(0.12, 0.122, 0.125), bevel * 0.7);
    col = min(col, vec3f(6.0));
  } else if (i.mat > 4.5) {
    // handle: dark walnut, straight grain along the handle, a satin oil finish and three steel rivets
    let p = clamp((-i.rest.x - 0.07) / 0.84, 0.0, 1.0);
    let cy = 0.56 - 0.028 * p * p;
    var rivet = 0.0;
    for (var k = 0; k < 3; k++) {
      let rx = -0.24 - f32(k) * 0.25;
      let dd = length(vec2f(i.rest.x - rx, i.rest.y - cy));
      rivet = max(rivet, 1.0 - smoothstep(0.017, 0.021, dd));
    }
    rivet *= smoothstep(0.03, 0.045, abs(i.rest.z));
    let g = fbm(vec3f(i.rest.x * 2.2, i.rest.y * 38.0 + vnoise(i.rest * 9.0) * 2.0, i.rest.z * 38.0));
    let wood = mix(vec3f(0.028, 0.014, 0.008), vec3f(0.085, 0.045, 0.024), smoothstep(0.3, 0.75, g));
    let dif = max(dot(N, L), 0.0) * 0.8 + 0.3;
    let fr = 0.04 + 0.96 * pow(1.0 - NdV, 5.0);
    let envW = studioEnv(reflect(-V, N), 0.35, u.bg.rgb);
    col = wood * dif + envW * fr * 0.35 + vec3f(ggx(N, V, L, 0.35)) * 0.08 * u.keyDir.w;
    let envR = studioEnv(reflect(-V, N), 0.1, u.bg.rgb);
    col = mix(col, envR * 0.7 + vec3f(ggx(N, V, L, 0.12)) * 0.4, rivet);
  } else {
    // air bubble, soft and low-contrast: a lighter pocket with a faint rim and one pin-point highlight
    let rim = pow(1.0 - NdV, 2.0);
    col = mix(vec3f(0.86, 0.88, 0.9), vec3f(0.56, 0.6, 0.64), rim) + vec3f(ggx(N, V, L, 0.08)) * 0.5;
  }
  var o: BgOut; o.c = vec4f(col, linearDepth(i.wp)); return o;
}
`;

// ── back faces → linear depth (for view-ray thickness) ──
const WGSL_BACK = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u: U;
struct VIn { @location(0) p: vec3f };
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f };
@vertex fn vs(v: VIn) -> VOut { var o: VOut; o.pos = u.viewProj * vec4f(v.p, 1.0); o.wp = v.p; return o; }
@fragment fn fs(i: VOut) -> @location(0) vec4f { return vec4f(linearDepth(i.wp), 0.0, 0.0, 1.0); }

// ── main: copy the scene, then the jelly itself, then the optional mesh overlay ──
const WGSL_MAIN = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var sceneTex: texture_2d<f32>;
@group(0) @binding(2) var backTex: texture_2d<f32>;
@group(0) @binding(3) var lin: sampler;
@group(0) @binding(4) var artTex: texture_2d<f32>;
@group(0) @binding(5) var artSmp: sampler;

@vertex fn vsFull(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  return vec4f(p, 0.0, 1.0);
}
@fragment fn fsCopy(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  return vec4f(textureLoad(sceneTex, vec2i(fc.xy), 0).rgb, 1.0);
}

struct VIn { @location(0) p: vec3f, @location(1) n: vec3f, @location(2) rest: vec3f, @location(3) mat: f32 };
struct VOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) rest: vec3f };
@vertex fn vsJelly(v: VIn) -> VOut {
  var o: VOut;
  o.pos = u.viewProj * vec4f(v.p, 1.0);
  o.wp = v.p; o.n = v.n; o.rest = v.rest;
  return o;
}

fn toUV(p: vec3f) -> vec2f {
  let c = u.viewProj * vec4f(p, 1.0);
  let n = c.xy / c.w;
  return vec2f(n.x * 0.5 + 0.5, 0.5 - n.y * 0.5);
}

@fragment fn fsJelly(i: VOut, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  // ── the drawing, running straight down through the body: rest-plane (u, w) → texture ──
  // i.rest is (u, height, w); on the walls u and w are already pulled in past the drawn contour
  let Q = i.rest;
  let c = textureSample(artTex, artSmp, (Q.xz - u.art.xy) * u.art.zw).rgb;
  // drawn lines and the dark of the eyes are dense gel that lets almost nothing through
  let line = 1.0 - smoothstep(0.015, 0.11, dot(c, vec3f(0.2126, 0.7152, 0.0722)));

  var N = normalize(i.n);
  if (!ff) { N = -N; }
  let P = i.wp;
  let V = normalize(u.camPos.xyz - P);
  let L = u.keyDir.xyz;
  let key = u.keyDir.w;
  let NdV = max(dot(N, V), 1e-3);

  // ── thickness along the view ray ──
  let uv = i.pos.xy * u.screen.zw;
  let pix = vec2i(i.pos.xy);
  let fz = linearDepth(P);
  let bz = textureLoad(backTex, pix, 0).r;
  let sz = textureLoad(sceneTex, pix, 0).a;
  let cosv = max(dot(-V, u.camFwd.xyz), 0.35);
  let thick = clamp((min(bz, sz) - fz) / cosv, 0.0, 3.0);
  let thickBack = clamp((bz - fz) / cosv, 0.0, 3.0);

  // internal texture: a faint cloudy grain
  let grain = fbm(vec3f(Q.x * 9.0, Q.y * 11.0, Q.z * 9.0));
  let grain2 = vnoise(Q * 46.0);
  let dens = 1.0 + (grain - 0.5) * 0.35 + (grain2 - 0.5) * 0.12;

  // ── absorption / scattering: the colour of the drawing is the colour of the jelly ──
  let sigma = -log(clamp(c, vec3f(0.003), vec3f(0.985))) * u.jelly.x * dens + vec3f(line * 24.0);
  let scatK = mix(u.jelly.y, 26.0, line);
  let rough = 0.1 + 0.05 * line;

  // ── refraction: bend the view ray into the jelly, find where it leaves ──
  let ior = 1.42;
  let Rr = refract(-V, N, 1.0 / ior);
  let exitP = P + Rr * min(thickBack, 0.9) * 0.55;
  var ruv = toUV(exitP);
  ruv = mix(uv, ruv, 0.85);
  // a little diffusion inside the candy blurs what lies behind
  let blurR = (0.001 + 0.007 * min(thick, 1.0)) * (0.6 + scatK * 0.02);
  // each tap is absorbed over its own path length (to a bubble, the blade or out through the back)
  var transmitted = vec3f(0.0);
  var pathL = 0.0;
  for (var k = 0; k < 7; k++) {
    let a = f32(k) * 0.8976 + 0.3;
    let o = select(vec2f(cos(a), sin(a)) * blurR, vec2f(0.0), k == 6);
    let s = textureSampleLevel(sceneTex, lin, clamp(ruv + o, vec2f(0.001), vec2f(0.999)), 0.0);
    let pl = clamp(min(thickBack, max(s.a - fz, 0.0) / cosv + 0.03), 0.0, 3.0);
    transmitted += s.rgb * exp(-sigma * pl);
    pathL += pl;
  }
  transmitted /= 7.0; pathL /= 7.0;
  let scat = 1.0 - exp(-scatK * pathL * 0.5 - scatK * 0.02);

  // ── light arriving inside the body ──
  let NdL = dot(N, L);
  let wrap = clamp((NdL + 0.6) / 1.6, 0.0, 1.0);
  let amb = u.bg.rgb * mix(0.3, 0.75, N.y * 0.5 + 0.5);
  let inner = c * u.jelly.z * (amb + vec3f(1.0, 0.97, 0.92) * key * 0.45 * wrap);

  // thin edges glow when the key light is behind them
  let back = pow(clamp(dot(V, -L), 0.0, 1.0), 3.0) * 1.4 + 0.25;
  let thinK = exp(-(sigma + vec3f(scatK * 0.35)) * (pathL * 0.6 + 0.05));
  let glow = mix(c, vec3f(1.0), 0.2) * thinK * back * key * 0.42 * (1.0 - line * 0.7) * clamp(1.0 - NdL * 0.6, 0.0, 1.0);

  // ── assemble body color ──
  var body = transmitted * (1.0 - scat) + inner * scat + glow;

  // tiny sub-surface glints (sugar crystals)
  let R = reflect(-V, N);
  let cell = floor(Q * vec3f(70.0, 70.0, 70.0));
  let spark = step(0.985, hash3(cell)) * pow(max(dot(R, L), 0.0), 40.0) * (1.0 - line);
  body += vec3f(1.0, 0.95, 0.9) * spark * 0.2;

  // ── surface: Fresnel reflection of the studio + key highlight ──
  let F0 = 0.036;
  let F = F0 + (1.0 - F0) * pow(1.0 - NdV, 5.0);
  let env = studioEnv(R, rough, u.bg.rgb);
  let spec = ggx(N, V, L, rough) * key * vec3f(1.0, 0.97, 0.93);
  let col = body * (1.0 - F) + env * F + spec * 0.9;

  return vec4f(col, 1.0);
}

// ── mesh overlay ──
struct LOut { @builtin(position) pos: vec4f, @location(0) d: f32 };
@vertex fn vsLine(@location(0) p: vec3f) -> LOut {
  var o: LOut; o.pos = u.viewProj * vec4f(p, 1.0); o.d = linearDepth(p); return o;
}
@fragment fn fsLine(i: LOut) -> @location(0) vec4f {
  let a = u.misc.y * mix(0.9, 0.35, clamp((i.d - 5.0) * 0.5, 0.0, 1.0));
  return vec4f(vec3f(0.04, 0.05, 0.06) * a, a);
}
`;

// ── post: exposure, Khronos PBR Neutral tone mapping, sRGB, dither ──
const WGSL_POST = WGSL_COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var hdr: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  return vec4f(p, 0.0, 1.0);
}
fn neutral(c0: vec3f) -> vec3f {
  let startC = 0.8 - 0.04;
  let desat = 0.15;
  let x = min(c0.r, min(c0.g, c0.b));
  let off = select(0.04, x - 6.25 * x * x, x < 0.08);
  var c = c0 - off;
  let peak = max(c.r, max(c.g, c.b));
  if (peak < startC) { return c; }
  let d = 1.0 - startC;
  let np = 1.0 - d * d / (peak + d - startC);
  c *= np / peak;
  let g = 1.0 - 1.0 / (desat * (peak - np) + 1.0);
  return mix(c, vec3f(np), g);
}
fn oetf(c: vec3f) -> vec3f {
  return select(1.055 * pow(c, vec3f(1.0 / 2.4)) - 0.055, c * 12.92, c <= vec3f(0.0031308));
}
@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  var c = textureLoad(hdr, vec2i(fc.xy), 0).rgb * u.misc.x;
  c = neutral(max(c, vec3f(0.0)));
  var s = oetf(clamp(c, vec3f(0.0), vec3f(1.0)));
  s += (hash3(vec3f(fc.xy, 1.0)) - 0.5) / 255.0;
  return vec4f(s, 1.0);
}
`;

// ===== renderer.js =====
// ─────────────────────────────────────────────────────────────
//  WebGPU renderer
//  passes: key-light shadow map · top-down height map (contact AO)
//          · scene (floor, bubbles, knife; MSAA) · jelly back-face depth
//          · jelly (refraction/absorption; MSAA) + mesh overlay · tone map
// ─────────────────────────────────────────────────────────────

// ── tiny mat4 helpers (column-major, WebGPU clip z ∈ [0,1]) ──
const M4 = {
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  },
  perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
    o[0] = f / aspect; o[5] = f; o[10] = far / (near - far); o[11] = -1; o[14] = near * far / (near - far);
    return o;
  },
  ortho(l, r, b, t, n, f) {
    const o = new Float32Array(16);
    o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = 1 / (n - f);
    o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = n / (n - f); o[15] = 1;
    return o;
  },
  lookAt(eye, at, up) {
    let zx = eye[0] - at[0], zy = eye[1] - at[1], zz = eye[2] - at[2];
    let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]), -(yx * eye[0] + yy * eye[1] + yz * eye[2]), -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]);
  },
  invert(m) {
    const inv = new Float32Array(16);
    const [a00, a01, a02, a03, a10, a11, a12, a13, a20, a21, a22, a23, a30, a31, a32, a33] = m;
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
    const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
    const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    const det = 1 / (b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06);
    inv[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; inv[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    inv[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; inv[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    inv[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; inv[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    inv[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; inv[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    inv[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; inv[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    inv[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; inv[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    inv[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; inv[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    inv[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; inv[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return inv;
  },
};

const MSAA = 4;
const UBO_SIZE = 464;

class Renderer {
  static async create(canvas, mesh, simEdges, nParticles, arts) {
    if (!navigator.gpu) throw new Error('no-webgpu');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('no-adapter');
    const device = await adapter.requestDevice();
    const r = new Renderer(canvas, device, mesh, simEdges, nParticles, arts);
    r.adapter = adapter; Renderer.keep = { adapter, gpu: navigator.gpu };
    await r.checkShaders();
    return r;
  }

  constructor(canvas, device, mesh, simEdges, nParticles, arts) {
    this.canvas = canvas;
    this.device = device;
    this.ctx = canvas.getContext('webgpu');
    this.format = navigator.gpu.getPreferredCanvasFormat();
    this.ctx.configure({ device, format: this.format, alphaMode: 'opaque', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    this.mesh = mesh;
    this.nV = mesh.rest.length / 3;
    this.lost = false;
    device.lost.then(info => {
      this.lost = true; this.onLost && this.onLost(info);
    });
    device.addEventListener && device.addEventListener('uncapturederror', e => { this.onError && this.onError(e.error); });

    this.setMesh(mesh, simEdges, nParticles);

    this.ubo = device.createBuffer({ size: UBO_SIZE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.uboData = new Float32Array(UBO_SIZE / 4);
    this.lightUbo = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.topUbo = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    this.cmpSampler = device.createSampler({ compare: 'less', magFilter: 'linear', minFilter: 'linear' });
    this.linSampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
    this.artSampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', maxAnisotropy: 8, addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
    this.artTexs = arts.map(img => this.makeArt(img));
    this.artTex = this.artTexs[0];

    this.shadowSize = 1024; this.topSize = 512;
    this.shadowTex = device.createTexture({ size: [this.shadowSize, this.shadowSize], format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    this.topTex = device.createTexture({ size: [this.topSize, this.topSize], format: 'depth32float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });

    this.buildPipelines();
    this.w = 0; this.h = 0;
    this.knifeVisible = false;
  }

  // a drawing as an sRGB texture with a full mip chain, each level drawn down from the one before
  makeArt(img) {
    const d = this.device, size = img.width;
    const levels = Math.floor(Math.log2(size)) + 1;
    const tex = d.createTexture({
      size: [size, size], format: 'rgba8unorm-srgb', mipLevelCount: levels,
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
    });
    let src = img;
    for (let l = 0, sz = size; l < levels; l++, sz = Math.max(1, sz >> 1)) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = sz;
      const g = cv.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(src, 0, 0, sz, sz);
      d.queue.copyExternalImageToTexture({ source: cv }, { texture: tex, mipLevel: l }, [sz, sz]);
      src = cv;
    }
    return tex;
  }

  // switch to another look's drawing
  useArt(i) {
    this.artTex = this.artTexs[i];
    if (this.sceneTex) this.bindMain();
  }

  bindMain() {
    this.bgMain = this.device.createBindGroup({ layout: this.layoutMain, entries: [
      { binding: 0, resource: { buffer: this.ubo } },
      { binding: 1, resource: this.sceneTex.createView() },
      { binding: 2, resource: this.backTex.createView() },
      { binding: 3, resource: this.linSampler },
      { binding: 4, resource: this.artTex.createView() },
      { binding: 5, resource: this.artSampler }] });
  }

  // the knife is a small rigid mesh posed on the CPU each frame
  setKnife(k) {
    const device = this.device;
    const nK = k.rest.length / 3;
    this.knifeDyn = new Float32Array(nK * 6);
    this.knifeDynBuf = device.createBuffer({ size: this.knifeDyn.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    const st = new Float32Array(nK * 4);
    for (let i = 0; i < nK; i++) { st[4 * i] = k.rest[3 * i]; st[4 * i + 1] = k.rest[3 * i + 1]; st[4 * i + 2] = k.rest[3 * i + 2]; st[4 * i + 3] = k.mat[i]; }
    const mk = (data, usage) => { const b = device.createBuffer({ size: Math.ceil(data.byteLength / 4) * 4, usage: usage | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, data); return b; };
    this.knifeStatic = mk(st, GPUBufferUsage.VERTEX);
    this.knifeIdx = mk(k.index, GPUBufferUsage.INDEX);
    this.knifeCount = k.index.length;
  }

  // (re)build every mesh-sized GPU buffer — at start and after each knife cut, never while dragging
  setMesh(mesh, simEdges, nParticles) {
    const device = this.device;
    for (const b of ['dynBuf', 'staticBuf', 'indexBuf', 'lineIdx', 'particleBuf']) if (this[b]) this[b].destroy();
    this.mesh = mesh;
    this.nV = mesh.rest.length / 3;
    const buf = (data, usage) => {
      const b = device.createBuffer({ size: Math.max(4, Math.ceil(data.byteLength / 4) * 4), usage: usage | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(b, 0, data);
      return b;
    };
    // dynamic: skinned position + normal (updated each frame, reallocated only when the mesh changes)
    this.dyn = new Float32Array(this.nV * 6);
    this.dynBuf = device.createBuffer({ size: this.dyn.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    // static: the point of the drawing each vertex shows (u, w), its rest height, its material
    const st = new Float32Array(this.nV * 4);
    for (let i = 0; i < this.nV; i++) { st[4 * i] = mesh.tex[2 * i]; st[4 * i + 1] = mesh.rest[3 * i + 1]; st[4 * i + 2] = mesh.tex[2 * i + 1]; st[4 * i + 3] = mesh.mat[i]; }
    this.staticBuf = buf(st, GPUBufferUsage.VERTEX);
    this.indexBuf = buf(mesh.index, GPUBufferUsage.INDEX);
    this.lineIdx = buf(simEdges, GPUBufferUsage.INDEX);
    this.lineCount = simEdges.length;
    this.particleBuf = device.createBuffer({ size: nParticles * 12, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  }

  buildPipelines() {
    const d = this.device;
    const V = GPUShaderStage.VERTEX, F = GPUShaderStage.FRAGMENT;
    this.modules = {
      depth: d.createShaderModule({ label: 'depth', code: WGSL_DEPTH }),
      scene: d.createShaderModule({ label: 'scene', code: WGSL_SCENE }),
      back: d.createShaderModule({ label: 'back', code: WGSL_BACK }),
      main: d.createShaderModule({ label: 'main', code: WGSL_MAIN }),
      post: d.createShaderModule({ label: 'post', code: WGSL_POST }),
    };
    const uboEntry = { binding: 0, visibility: V | F, buffer: { type: 'uniform' } };
    this.layoutDepth = d.createBindGroupLayout({ entries: [{ binding: 0, visibility: V, buffer: { type: 'uniform' } }] });
    this.layoutScene = d.createBindGroupLayout({ entries: [uboEntry,
      { binding: 1, visibility: F, texture: { sampleType: 'depth' } },
      { binding: 2, visibility: F, texture: { sampleType: 'depth' } },
      { binding: 3, visibility: F, sampler: { type: 'comparison' } }] });
    this.layoutU = d.createBindGroupLayout({ entries: [uboEntry] });
    this.layoutMain = d.createBindGroupLayout({ entries: [uboEntry,
      { binding: 1, visibility: F, texture: { sampleType: 'float' } },
      { binding: 2, visibility: F, texture: { sampleType: 'unfilterable-float' } },
      { binding: 3, visibility: F, sampler: { type: 'filtering' } },
      { binding: 4, visibility: F, texture: { sampleType: 'float' } },
      { binding: 5, visibility: F, sampler: { type: 'filtering' } }] });
    this.layoutPost = d.createBindGroupLayout({ entries: [uboEntry,
      { binding: 1, visibility: F, texture: { sampleType: 'unfilterable-float' } }] });
    const pl = l => d.createPipelineLayout({ bindGroupLayouts: [l] });

    const posOnly = { arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] };
    const meshVB = [
      { arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] },
      { arrayStride: 16, attributes: [{ shaderLocation: 2, offset: 0, format: 'float32x3' }, { shaderLocation: 3, offset: 12, format: 'float32' }] },
    ];
    const HDR = 'rgba16float';
    const ms = { count: MSAA };

    this.pDepth = d.createRenderPipeline({
      label: 'depth', layout: pl(this.layoutDepth),
      vertex: { module: this.modules.depth, entryPoint: 'vs', buffers: [posOnly] },
      primitive: { topology: 'triangle-list', cullMode: 'none' },
      depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'less', depthBias: 2, depthBiasSlopeScale: 2 },
    });
    this.pBackground = d.createRenderPipeline({
      label: 'background', layout: pl(this.layoutScene),
      vertex: { module: this.modules.scene, entryPoint: 'vsFull' },
      fragment: { module: this.modules.scene, entryPoint: 'fsBackground', targets: [{ format: HDR }] },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'always' },
      multisample: ms,
    });
    this.pProps = d.createRenderPipeline({
      label: 'props', layout: pl(this.layoutScene),
      vertex: { module: this.modules.scene, entryPoint: 'vsMesh', buffers: meshVB },
      fragment: { module: this.modules.scene, entryPoint: 'fsProps', targets: [{ format: HDR }] },
      primitive: { topology: 'triangle-list', cullMode: 'back' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
      multisample: ms,
    });
    this.pBack = d.createRenderPipeline({
      label: 'back', layout: pl(this.layoutU),
      vertex: { module: this.modules.back, entryPoint: 'vs', buffers: [posOnly] },
      fragment: { module: this.modules.back, entryPoint: 'fs', targets: [{ format: 'r32float' }] },
      primitive: { topology: 'triangle-list', cullMode: 'front' },
      depthStencil: { format: 'depth32float', depthWriteEnabled: true, depthCompare: 'greater' },
    });
    this.pCopy = d.createRenderPipeline({
      label: 'copy', layout: pl(this.layoutMain),
      vertex: { module: this.modules.main, entryPoint: 'vsFull' },
      fragment: { module: this.modules.main, entryPoint: 'fsCopy', targets: [{ format: HDR }] },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'always' },
      multisample: ms,
    });
    this.pJelly = d.createRenderPipeline({
      label: 'jelly', layout: pl(this.layoutMain),
      vertex: { module: this.modules.main, entryPoint: 'vsJelly', buffers: meshVB },
      fragment: { module: this.modules.main, entryPoint: 'fsJelly', targets: [{ format: HDR }] },
      primitive: { topology: 'triangle-list', cullMode: 'back' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
      multisample: ms,
    });
    this.pLines = d.createRenderPipeline({
      label: 'lines', layout: pl(this.layoutMain),
      vertex: { module: this.modules.main, entryPoint: 'vsLine', buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }] },
      fragment: {
        module: this.modules.main, entryPoint: 'fsLine', targets: [{
          format: HDR,
          blend: { color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } },
        }],
      },
      primitive: { topology: 'line-list' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'always' },
      multisample: ms,
    });
    this.pPost = d.createRenderPipeline({
      label: 'post', layout: pl(this.layoutPost),
      vertex: { module: this.modules.post, entryPoint: 'vs' },
      fragment: { module: this.modules.post, entryPoint: 'fs', targets: [{ format: this.format }] },
    });

    this.bgLight = d.createBindGroup({ layout: this.layoutDepth, entries: [{ binding: 0, resource: { buffer: this.lightUbo } }] });
    this.bgTop = d.createBindGroup({ layout: this.layoutDepth, entries: [{ binding: 0, resource: { buffer: this.topUbo } }] });
    this.bgScene = d.createBindGroup({ layout: this.layoutScene, entries: [
      { binding: 0, resource: { buffer: this.ubo } },
      { binding: 1, resource: this.shadowTex.createView() },
      { binding: 2, resource: this.topTex.createView() },
      { binding: 3, resource: this.cmpSampler }] });
    this.bgU = d.createBindGroup({ layout: this.layoutU, entries: [{ binding: 0, resource: { buffer: this.ubo } }] });
  }

  async checkShaders() {
    const problems = [];
    for (const [name, m] of Object.entries(this.modules)) {
      if (!m.getCompilationInfo) continue;
      const info = await m.getCompilationInfo();
      for (const msg of info.messages) if (msg.type === 'error') problems.push(`${name}:${msg.lineNum}:${msg.linePos} ${msg.message}`);
    }
    if (problems.length) throw new Error('WGSL compile error\n' + problems.join('\n'));
  }

  resize(w, h) {
    w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
    if (w === this.w && h === this.h) return;
    this.w = w; this.h = h;
    this.canvas.width = w; this.canvas.height = h;
    const d = this.device;
    for (const t of ['msScene', 'msDepth', 'sceneTex', 'backTex', 'backDepth', 'msHdr', 'hdrTex']) this[t] && this[t].destroy();
    const RA = GPUTextureUsage.RENDER_ATTACHMENT, TB = GPUTextureUsage.TEXTURE_BINDING;
    this.msScene = d.createTexture({ size: [w, h], format: 'rgba16float', sampleCount: MSAA, usage: RA });
    this.msDepth = d.createTexture({ size: [w, h], format: 'depth24plus', sampleCount: MSAA, usage: RA });
    this.sceneTex = d.createTexture({ size: [w, h], format: 'rgba16float', usage: RA | TB });
    this.backTex = d.createTexture({ size: [w, h], format: 'r32float', usage: RA | TB });
    this.backDepth = d.createTexture({ size: [w, h], format: 'depth32float', usage: RA });
    this.msHdr = d.createTexture({ size: [w, h], format: 'rgba16float', sampleCount: MSAA, usage: RA });
    this.hdrTex = d.createTexture({ size: [w, h], format: 'rgba16float', usage: RA | TB });
    this.bindMain();
    this.bgPost = d.createBindGroup({ layout: this.layoutPost, entries: [
      { binding: 0, resource: { buffer: this.ubo } },
      { binding: 1, resource: this.hdrTex.createView() }] });
  }

  // fill the uniform block; cam = { viewProj, view, invViewProj, pos, fwd }
  setUniforms(cam, light, params) {
    const u = this.uboData;
    u.set(cam.viewProj, 0); u.set(cam.view, 16); u.set(cam.invViewProj, 32);
    u.set(light.lightVP, 48); u.set(light.topVP, 64);
    u.set([...cam.pos, params.time], 80);
    u.set([...cam.fwd, 0], 84);
    u.set([...light.dir, light.intensity], 88);
    u.set([this.w, this.h, 1 / this.w, 1 / this.h], 92);
    u.set(params.art, 96);
    u.set(params.jelly, 100);
    u.set([params.exposure, params.meshAlpha, 0, 0], 104);
    u.set([...params.bg, 1], 108);
    u.set([...params.shadowTint, 1], 112);
    this.device.queue.writeBuffer(this.ubo, 0, u);
    this.device.queue.writeBuffer(this.lightUbo, 0, light.lightVP);
    this.device.queue.writeBuffer(this.topUbo, 0, light.topVP);
  }

  uploadGeometry(particles, showMesh) {
    this.device.queue.writeBuffer(this.dynBuf, 0, this.dyn);
    if (this.knifeVisible && this.knifeDynBuf) this.device.queue.writeBuffer(this.knifeDynBuf, 0, this.knifeDyn);
    if (showMesh) this.device.queue.writeBuffer(this.particleBuf, 0, particles);
  }

  capture() { return new Promise(r => { this.captureResolve = r; }); }

  draw(showMesh) {
    if (this.lost) return;
    const d = this.device, m = this.mesh;
    const enc = d.createCommandEncoder();

    // shadow map from the key light, and a top-down height map for contact occlusion
    const knife = this.knifeVisible && this.knifeDynBuf;
    for (const [tex, bg] of [[this.shadowTex, this.bgLight], [this.topTex, this.bgTop]]) {
      const p = enc.beginRenderPass({ colorAttachments: [], depthStencilAttachment: { view: tex.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
      p.setPipeline(this.pDepth); p.setBindGroup(0, bg);
      p.setVertexBuffer(0, this.dynBuf); p.setIndexBuffer(this.indexBuf, 'uint32');
      p.drawIndexed(m.body.count, 1, 0, 0, 0);
      // the knife casts a shadow but stays out of the contact-occlusion height map
      if (knife && tex === this.shadowTex) {
        p.setVertexBuffer(0, this.knifeDynBuf); p.setIndexBuffer(this.knifeIdx, 'uint32');
        p.drawIndexed(this.knifeCount, 1, 0, 0, 0);
      }
      p.end();
    }
    // scene behind / inside the jelly
    {
      const p = enc.beginRenderPass({
        colorAttachments: [{ view: this.msScene.createView(), resolveTarget: this.sceneTex.createView(), clearValue: [0, 0, 0, 1000], loadOp: 'clear', storeOp: 'discard' }],
        depthStencilAttachment: { view: this.msDepth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      p.setBindGroup(0, this.bgScene);
      p.setPipeline(this.pBackground); p.draw(3);
      p.setPipeline(this.pProps);
      p.setVertexBuffer(0, this.dynBuf); p.setVertexBuffer(1, this.staticBuf); p.setIndexBuffer(this.indexBuf, 'uint32');
      if (m.bubbles.count) p.drawIndexed(m.bubbles.count, 1, m.bubbles.first, 0, 0);
      // the knife lives in the scene pass, so the part buried in the jelly is seen refracted through it
      if (knife) {
        p.setVertexBuffer(0, this.knifeDynBuf); p.setVertexBuffer(1, this.knifeStatic); p.setIndexBuffer(this.knifeIdx, 'uint32');
        p.drawIndexed(this.knifeCount, 1, 0, 0, 0);
      }
      p.end();
    }
    // farthest back face depth
    {
      const p = enc.beginRenderPass({
        colorAttachments: [{ view: this.backTex.createView(), clearValue: [0, 0, 0, 0], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: this.backDepth.createView(), depthClearValue: 0, depthLoadOp: 'clear', depthStoreOp: 'discard' },
      });
      p.setPipeline(this.pBack); p.setBindGroup(0, this.bgU);
      p.setVertexBuffer(0, this.dynBuf); p.setIndexBuffer(this.indexBuf, 'uint32');
      p.drawIndexed(m.body.count, 1, 0, 0, 0);
      p.end();
    }
    // jelly
    {
      const p = enc.beginRenderPass({
        colorAttachments: [{ view: this.msHdr.createView(), resolveTarget: this.hdrTex.createView(), clearValue: [0, 0, 0, 1], loadOp: 'clear', storeOp: 'discard' }],
        depthStencilAttachment: { view: this.msDepth.createView(), depthLoadOp: 'load', depthStoreOp: 'discard' },
      });
      p.setBindGroup(0, this.bgMain);
      p.setPipeline(this.pCopy); p.draw(3);
      p.setPipeline(this.pJelly);
      p.setVertexBuffer(0, this.dynBuf); p.setVertexBuffer(1, this.staticBuf); p.setIndexBuffer(this.indexBuf, 'uint32');
      p.drawIndexed(m.body.count, 1, 0, 0, 0);
      if (showMesh) {
        p.setPipeline(this.pLines);
        p.setVertexBuffer(0, this.particleBuf); p.setIndexBuffer(this.lineIdx, 'uint32');
        p.drawIndexed(this.lineCount, 1, 0, 0, 0);
      }
      p.end();
    }
    // tone map to the swap chain
    const out = this.ctx.getCurrentTexture();
    {
      const p = enc.beginRenderPass({ colorAttachments: [{ view: out.createView(), clearValue: [1, 1, 1, 1], loadOp: 'clear', storeOp: 'store' }] });
      p.setPipeline(this.pPost); p.setBindGroup(0, this.bgPost); p.draw(3);
      p.end();
    }
    // optional still capture (used for saving a frame / automated checks)
    let cap = null;
    if (this.captureResolve) {
      const bpr = Math.ceil(this.w * 4 / 256) * 256;
      const buf = d.createBuffer({ size: bpr * this.h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      enc.copyTextureToBuffer({ texture: out }, { buffer: buf, bytesPerRow: bpr }, [this.w, this.h]);
      cap = { buf, bpr, w: this.w, h: this.h, resolve: this.captureResolve, bgra: this.format.startsWith('bgra') };
      this.captureResolve = null;
    }
    d.queue.submit([enc.finish()]);
    if (cap) cap.buf.mapAsync(GPUMapMode.READ).then(() => {
      const src = new Uint8Array(cap.buf.getMappedRange());
      const px = new Uint8ClampedArray(cap.w * cap.h * 4);
      for (let y = 0; y < cap.h; y++) for (let x = 0; x < cap.w; x++) {
        const s = y * cap.bpr + x * 4, o = (y * cap.w + x) * 4;
        px[o] = src[s + (cap.bgra ? 2 : 0)]; px[o + 1] = src[s + 1]; px[o + 2] = src[s + (cap.bgra ? 0 : 2)]; px[o + 3] = 255;
      }
      cap.buf.unmap(); cap.buf.destroy();
      cap.resolve({ w: cap.w, h: cap.h, px });
    });
  }
}

// ===== main.js =====
// ─────────────────────────────────────────────────────────────
//  App: sim ↔ render glue, camera, picking, UI
// ─────────────────────────────────────────────────────────────

const srgbToLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
const linToSrgb = c => (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
const hex = rgb => '#' + rgb.map(c => Math.round(Math.min(1, Math.max(0, linToSrgb(c))) * 255).toString(16).padStart(2, '0')).join('');

// per look: where its drawing sits in the rest plane (origin (u, w), 1 / size), and the tint its
// shadow takes from the drawing's average colour
for (const l of LOOKS) {
  l.rect = [l.art.u0, l.art.w0, 1 / l.art.size, 1 / l.art.size];
  const c = l.tint.map(v => srgbToLin(v / 255)), m = Math.max(...c, 1e-3);

        for (let k = 0; k < 3; k++) {
          let xs = 0, vs = 0;
          for (let j = 0; j < 4; j++) { const q = old.tets[4 * t + j]; xs += old.x[3 * q + k] * e.w[4 * i + j]; vs += old.v[3 * q + k] * e.w[4 * i + j]; }

    skinIdx = w.skinIdx; skinW = w.skinW; index = renderMesh.index; bodyTriEnd = renderMesh.body.count; vComp = renderMesh.vComp;

  }

  // ── the visible knife: hovers under the pointer, lines up over the stroke, then cuts ──
  const knifeMesh = buildKnifeMesh();
  renderer.setKnife(knifeMesh);
  const HOVER_H = 0.42;                           // edge height above the top of the jelly while hovering
  const kp = { P: [0, SHAPE.T + HOVER_H + 1.4, 0.9], yaw: -0.62, roll: 0.16, pitch: 0.05 };
  const blade = { holdY: 0, mode: null, p: [0, 0, 0], d: [1, 0, 0], n: [0, 0, 1], a0: -KNIFE.xr, a1: KNIFE.Lb - KNIFE.xr, top: KNIFE.H * 0.95, halfGap: 0.03, side: null };
  sim.blade = blade;
  let knifeAnim = null, hoverSeen = false;
  const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
  const lerp = (a, b, s) => a + (b - a) * s;

  function knifeBasis(yaw, roll, pitch) {

    const cr = Math.cos(roll), sr = Math.sin(roll), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const Y1 = [-sr * z[0], cr, -sr * z[2]], Z = [cr * z[0], sr, cr * z[2]];

  }
  function poseKnife() {
    const [X, Y, Z] = knifeBasis(kp.yaw, kp.roll, kp.pitch);
    const out = renderer.knifeDyn, r = knifeMesh.rest, nr = knifeMesh.nrm, P = kp.P, xr = KNIFE.xr;
    for (let v = 0, o = 0; v < r.length; v += 3, o += 6) {
      const lx = r[v] - xr, ly = r[v + 1], lz = r[v + 2];
      out[o] = P[0] + X[0] * lx + Y[0] * ly + Z[0] * lz;
      out[o + 1] = P[1] + X[1] * lx + Y[1] * ly + Z[1] * lz;
      out[o + 2] = P[2] + X[2] * lx + Y[2] * ly + Z[2] * lz;
      const nx = nr[v], ny = nr[v + 1], nz = nr[v + 2];
      out[o + 3] = X[0] * nx + Y[0] * ny + Z[0] * nz;
      out[o + 4] = X[1] * nx + Y[1] * ny + Z[1] * nz;
      out[o + 5] = X[2] * nx + Y[2] * ny + Z[2] * nz;
    }
  }
  // where the knife wants to be when it is not cutting
  function hoverPose() {
    let q = hoverSeen ? rayPlaneY(rayFrom(hoverX, hoverY), SHAPE.T + HOVER_H) : null;
    if (q) { const dx = q[0] - target[0], dz = q[2] - target[2], dl = Math.hypot(dx, dz); if (dl > 3) { q[0] = target[0] + dx / dl * 3; q[2] = target[2] + dz / dl * 3; } }
    if (!q) { const c = sim.centroid(); q = [c[0] + 0.1, SHAPE.T + HOVER_H, c[2] + 0.25]; }
    return { P: q, yaw: camRightYaw(), roll: 0.16, pitch: 0.05 };
  }
  // while the stroke is being drawn: lined up over it, edge just above the jelly
  function strokePose() {
    const h = SHAPE.T + 0.1;
    const A = rayPlaneY(rayFrom(knife.ax, knife.ay), h), B = rayPlaneY(rayFrom(knife.bx, knife.by), h);
    if (!A || !B) return hoverPose();
    const dl = Math.hypot(B[0] - A[0], B[2] - A[2]);
    const yaw = dl > 0.08 ? canonicalYaw(B[0] - A[0], B[2] - A[2]) : kp.yaw;
    return { P: [(A[0] + B[0]) / 2, h, (A[2] + B[2]) / 2], yaw, roll: 0.08, pitch: 0 };
  }
  function easeToward(pose, k) {
    kp.P = lerp3(kp.P, pose.P, k);

  }
  // the cut, as a little piece of choreography (seconds)
  const KT = { align: 0.16, press: 0.42, through: 0.6, hold: 0.7, lift: 1.08 };
  function startCut(plan) {
    knifeAnim = { t: 0, plan, from: { P: kp.P.slice(), yaw: kp.yaw, roll: kp.roll, pitch: kp.pitch }, committed: false };
  }
  function runKnifeAnim(dt) {
    const a = knifeAnim, pl = a.plan;
    a.t += dt;
    const t = a.t, d = [Math.cos(pl.yaw), 0, Math.sin(pl.yaw)], M = pl.M;
    const at = (s, y) => [M[0] + d[0] * s, y, M[2] + d[2] * s];

    } else if (t < KT.hold) {

  function updateKnife(dt, animDt) {

    else easeToward(drag.mode === 'knife' ? strokePose() : hoverPose(), 1 - Math.exp(-dt * 16));

    renderer.knifeVisible = true;
  }

  // ── pointer interaction ──
  const drag = { mode: null, id: -1, plane: null, twist: 0, twist0: 0, second: null, lastX: 0, lastY: 0 };

    return q;
  }
  function applyGrab(x, y) {
    const q = dragTarget(x, y);
    if (q) sim.moveGrab(q, rotMat(cam.fwd, drag.twist));
  }
  canvas.addEventListener('pointerdown', e => {
    if (drag.mode === 'grab' && e.pointerId !== drag.id && e.pointerType === 'touch') {

    }

    if (e.button !== undefined && e.button > 0 && e.pointerType === 'mouse') return;

      e.preventDefault();
      return;
    }
    const hit = !state.paused ? (pick(rayFrom(e.clientX, e.clientY)) || pickNear(e.clientX, e.clientY, e.pointerType === 'touch' ? 34 : 18)) : null;
    drag.id = e.pointerId; drag.lastX = e.clientX; drag.lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointer */ }
    if (hit) {
      drag.mode = 'grab'; drag.twist = 0;
      drag.plane = { p: hit, n: cam.fwd.slice() };

      canvas.dataset.cursor = 'orbit';
    }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (drag.second && e.pointerId === drag.second.id) {

    }
    if (e.pointerId !== drag.id || !drag.mode) { hoverX = e.clientX; hoverY = e.clientY; hoverDirty = true; hoverSeen = true; return; }

    drag.lastX = e.clientX; drag.lastY = e.clientY;
    if (drag.mode === 'grab') applyGrab(e.clientX, e.clientY);
    else {
      state.az = Math.max(-1.1, Math.min(1.1, state.az - dx * 0.006));

  canvas.addEventListener('dblclick', () => { state.az = HOME_AZ; state.el = HOME_EL; state.zoom = 1; });
  let hoverX = 0, hoverY = 0, hoverDirty = false;

  // ── UI ──
  const firm = $('#firmness'), damp = $('#damping');
  const firmOut = $('#firmnessOut'), dampOut = $('#dampingOut');
  const syncSliders = () => {
    sim.firmness = firm.value / 100; sim.damping = damp.value / 100;
    firmOut.textContent = (firm.value / 100).toFixed(2);
    dampOut.textContent = (damp.value / 100).toFixed(2);
  };
  firm.value = Math.round(sim.firmness * 100); damp.value = Math.round(sim.damping * 100);
  firm.addEventListener('input', syncSliders); damp.addEventListener('input', syncSliders);
  syncSliders();


  $('#nudge').addEventListener('click', () => { if (!state.paused) sim.nudge(reduced.matches ? 0.45 : 1); });

  $('#reset').addEventListener('click', () => {
    knifeAnim = null; blade.mode = null;

  $('#mesh').addEventListener('change', e => { state.showMesh = e.target.checked; });

  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    if (state.paused && drag.mode === 'grab') { sim.endGrab(); drag.mode = null; }

    if (e.key === 'r' || e.key === 'R') $('#reset').click();
    if (e.key === 'k' || e.key === 'K') setTool(state.tool === 'knife' ? 'hand' : 'knife');

  let massG = 0;
  function updateReadouts() {
    massG = sim.totalRestVolume * SCALE_CM ** 3 * DENSITY;
    massOut.textContent = massG.toFixed(0);
    volOut.textContent = (sim.volumeRatio() * 100).toFixed(1);
    // KE with the illustrative length scale: v[m/s] = v_sim × 0.035, m[kg] = share of the candy's mass
    const ke = sim.kineticEnergy() / sim.totalMass * (massG / 1000) * (SCALE_CM / 100) ** 2; // J
    const uj = ke * 1e6;
    keOut.textContent = uj < 0.05 ? '0.00' : uj < 100 ? uj.toFixed(2) : uj.toFixed(0);

  // expose a small hook for automated checks
  window.__jelly = { sim, state, cam, pick, rayFrom, renderer, performCut, planCut, startCut, kp, blade, get knifeAnim() { return knifeAnim; }, setHover(x, y) { hoverX = x; hoverY = y; hoverSeen = true; },

    if (!state.paused) {

    followJelly(dt);
    updateCamera();
    updateLight();
    if (hoverDirty && !drag.mode) {
      hoverDirty = false;
      canvas.dataset.cursor = state.tool === 'knife' ? 'knife' : !state.paused && (pick(rayFrom(hoverX, hoverY)) || pickNear(hoverX, hoverY, 18)) ? 'grab' : '';
    }
    renderer.setUniforms(cam, light, {
      time: state.time, art: FOX.rect, jelly: JELLY, shadowTint: FOX.shadowTint,
      exposure: 1.0, meshAlpha: state.showMesh ? 0.32 : 0, bg: BG_RENDER,

}

main().catch(err => { console.error(err); showFallback('啟動時發生錯誤。', String(err && err.message || err)); });
