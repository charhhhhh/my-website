<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>軟爛胡言</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2l4 3h4l4-3v8l-6 5-6-5z' fill='%2385c8dd'/%3E%3Ccircle cx='5.6' cy='8' r='1.5' fill='%23323e87'/%3E%3Ccircle cx='10.4' cy='8' r='1.5' fill='%23323e87'/%3E%3C/svg%3E">
<meta name="description" content="一隻可以拉扯、搖晃、切開的軟體果凍胡言——四面體 XPBD 物理模擬與 WebGPU 果凍渲染。">
<style>
  :root {
    --bg: #E2DFDA;
    --ink: #1c1b19;
    --muted: #6d6962;
    --faint: #9a958c;
    --line: rgba(28, 27, 25, 0.16);
    --line-strong: rgba(28, 27, 25, 0.42);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Hoefler Text", Georgia, "Songti TC", "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "PMingLiU", serif;
    --sans: "Helvetica Neue", Helvetica, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "PingFang TC", "Microsoft JhengHei", monospace;
    --gutter: clamp(20px, 3vw, 44px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input { font: inherit; color: inherit; }

  /* ── stage ── */
  .stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; opacity: 0; transition: opacity .7s ease; outline: none; }
  body.ready canvas { opacity: 1; }
  canvas[data-cursor="grab"] { cursor: grab; }
  canvas[data-cursor="grabbing"] { cursor: grabbing; }
  canvas[data-cursor="orbit"] { cursor: move; }
  canvas[data-cursor="knife"] { cursor: crosshair; }
  .stroke { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
  .stroke.on { opacity: 1; }
  .stroke.fading { opacity: 0; transition: opacity .4s ease; }
  .stroke line { stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 2 5; }
  .stroke.fading line { stroke-dasharray: none; }
  .toast { position: absolute; left: 50%; bottom: 18%; transform: translate(-50%, 6px); padding: 8px 14px; border: 1px solid var(--line-strong);
    background: var(--bg); font: 14px/1.3 var(--serif); opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 11px; }
  .tool { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: transparent; padding: 8px 10px; min-height: 36px; cursor: pointer; font-size: 12.5px; }
  .tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tool:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--gutter); }
  .fallback[hidden] { display: none; }
  .fallback > div { max-width: 420px; border: 1px solid var(--line-strong); padding: 28px 28px 24px; background: var(--bg); }
  .fallback h2 { font: 400 30px/1.1 var(--serif); margin: 10px 0 12px; }
  .fallback p { margin: 0; color: var(--muted); font-size: 13px; }

  /* ── type ── */
  .kicker, .label { font: 500 12px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  .masthead { position: fixed; top: var(--gutter); left: var(--gutter); pointer-events: none; }
  .masthead h1 { font: 400 clamp(58px, 7.4vw, 118px)/1.04 var(--serif); letter-spacing: 0; margin: 0 0 20px; }
  .masthead h1 span { display: block; }
  .masthead h1 span + span { padding-left: .42em; }
  .caption { font: 400 15px/1.5 var(--serif); color: var(--muted); margin: 0; }

  /* ── specimen panel ── */
  .panel { position: fixed; right: var(--gutter); top: var(--gutter); width: 256px;
    border: 1px solid var(--line); background: rgba(226, 223, 218, .78); padding: 20px 20px 18px; }
  .group { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .group:first-child { padding-top: 0; }
  .group:last-of-type { border-bottom: 0; }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .swatch { background: none; border: 1px solid transparent; padding: 6px 6px 7px; cursor: pointer; text-align: left; }
  .swatch .chip { display: block; width: 100%; height: 48px; object-fit: contain; }
  .swname { display: block; margin-top: 7px; font: 13px/1 var(--serif); color: var(--muted); }
  .swatch[aria-checked="true"] { border-color: var(--line-strong); }
  .swatch[aria-checked="true"] .swname { color: var(--ink); }
  .swatch:focus-visible, .btn:focus-visible, input:focus-visible + .box, summary:focus-visible, input[type=range]:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  .slider + .slider { margin-top: 14px; }
  .slider .row { display: flex; justify-content: space-between; align-items: baseline; }
  .slider output { font: 12px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .slider .ends { display: flex; justify-content: space-between; font: 12px/1 var(--serif); color: var(--faint); margin-top: 2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 6px 0 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--line-strong); }
  input[type=range]::-moz-range-track { height: 1px; background: var(--line-strong); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ink); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ink); }
  input[type=range]:active::-webkit-slider-thumb { background: var(--ink); }

  .buttons { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .btn { border: 1px solid var(--line-strong); background: transparent; padding: 9px 12px; cursor: pointer; text-align: center; font-size: 12.5px; letter-spacing: .01em; }
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled, input:disabled, .swatch:disabled { opacity: .4; cursor: default; }
  .check:has(input:disabled) { opacity: .45; cursor: default; }
  .btn.wide { width: 100%; margin-top: 8px; }

  .checks { display: flex; gap: 22px; margin-top: 14px; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
  .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .check .box { width: 12px; height: 12px; border: 1px solid var(--ink); display: inline-block; position: relative; }
  .check input:checked + .box::after { content: ""; position: absolute; inset: 2px; background: var(--ink); }

  /* ── readouts ── */
  .readouts { position: fixed; left: var(--gutter); bottom: var(--gutter); max-width: 440px; }
  .stats { display: grid; grid-template-columns: repeat(4, auto); gap: 0; margin: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); width: max-content; }
  .stats > div { padding: 10px 22px 10px 0; }
  .stats > div + div { padding-left: 18px; border-left: 1px solid var(--line); }
  .stats dt { margin-bottom: 7px; }
  .stats dd { margin: 0; font: 20px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stats dd small { font: 12px/1 var(--sans); color: var(--muted); letter-spacing: .02em; margin-left: 3px; }

  body.no-gpu .readouts .stats { opacity: .45; }

  /* ── stacked layout for narrow screens ── */
  @media (max-width: 860px), (max-height: 560px) and (max-width: 1000px) {
    body { overflow: auto; }
    .masthead, .panel, .readouts, .stage { position: static; }
    body { display: grid; grid-template-columns: 1fr; grid-template-areas: "head" "stage" "read" "panel"; padding: 0 0 var(--gutter); }
    .masthead { grid-area: head; padding: var(--gutter) var(--gutter) 12px; }
    .masthead h1 { font-size: clamp(46px, 14vw, 76px); margin: 0 0 12px; }
    .caption { font-size: 14px; }
    .stage { grid-area: stage; height: clamp(300px, 56vh, 600px); position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .readouts { grid-area: read; padding: 18px var(--gutter) 6px; max-width: none; }
    .stats { width: 100%; grid-template-columns: repeat(4, 1fr); }
    .stats dd small { display: block; margin: 4px 0 0; }
    .stats > div { padding-right: 8px; }
    .stats > div + div { padding-left: 12px; }
    .stats dd { font-size: 18px; }
    .panel { grid-area: panel; width: auto; margin: 14px var(--gutter) 0; background: transparent; }
    .btn, .tool { min-height: 44px; font-size: 14px; }
    .toast { white-space: normal; width: max-content; max-width: 86vw; text-align: center; }
  }
  @media (max-height: 760px) and (min-width: 861px) {
    .panel { padding: 14px 16px 12px; }
    .group { padding: 11px 0; }
    .swatch .chip { height: 34px; }
    .slider + .slider { margin-top: 8px; }
    .checks { margin-top: 10px; }
    .btn { padding: 7px 10px; }
    .masthead h1 { font-size: clamp(52px, 6.4vw, 96px); margin: 0 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    canvas { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="互動式 3D 胡言。" role="img"></canvas>
    <svg class="stroke" id="stroke" aria-hidden="true"><line id="strokeLine" x1="0" y1="0" x2="0" y2="0"/></svg>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="fallback" id="fallback" hidden>
      <div>
        <span class="kicker">渲染器離線</span>
        <h2 id="fallbackTitle">這個標本需要 WebGPU。</h2>
        <p id="fallbackDetail"></p>
      </div>
    </div>
  </div>

  <header class="masthead">
    <h1><span>軟爛</span><span>胡言</span></h1>
    <p class="caption">如果你看扁我，我就扁扁地走開。<br>如果你小看我，我就小小地走開。<br>如果你惹毛我，我就毛茸茸地走開。</p>
  </header>

  <aside class="panel" aria-label="標本控制">
    <div class="group">
      <span class="label">工具</span>
      <div class="tools" role="group" aria-label="工具">
        <button class="tool" type="button" data-tool="hand" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 10V5.5a1.2 1.2 0 0 1 2.4 0V9m0-4.8V3.8a1.2 1.2 0 0 1 2.4 0V9m0-4.2a1.2 1.2 0 0 1 2.4 0V9.5m0-3a1.2 1.2 0 0 1 2.4 0V12c0 3.3-2.4 5.5-5.4 5.5-2.2 0-3.6-1-4.8-2.8L3.3 11.6a1.3 1.3 0 0 1 2-1.6L6 11"/></svg>手</button>
        <button class="tool" type="button" data-tool="knife" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17l9.2-9.2M12.2 7.8l3.6-4.3c.8 1.6.3 4-1.4 5.7L12.6 11 9 7.4"/><path d="M3 17l2.6-.6"/></svg>刀</button>
      </div>
    </div>
    <div class="group">
      <span class="label">造型</span>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="造型"></div>
    </div>
    <div class="group">
      <div class="slider">
        <div class="row"><label class="label" for="firmness">硬度</label><output id="firmnessOut" for="firmness">0.40</output></div>
        <input type="range" id="firmness" min="0" max="100" step="1" value="40">
        <div class="ends"><span>軟顫</span><span>凝固</span></div>
      </div>
      <div class="slider">
        <div class="row"><label class="label" for="damping">內部阻尼</label><output id="dampingOut" for="damping">0.45</output></div>
        <input type="range" id="damping" min="0" max="100" step="1" value="45">
        <div class="ends"><span>活潑</span><span>黏稠</span></div>
      </div>
    </div>
    <div class="group">
      <div class="buttons">
        <button class="btn" id="nudge" type="button">推它一下</button>
        <button class="btn" id="reset" type="button">重置</button>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="slow"><span class="box" aria-hidden="true"></span>¼ 速度</label>
        <label class="check"><input type="checkbox" id="mesh"><span class="box" aria-hidden="true"></span>顯示網格</label>
      </div>
      <button class="btn wide" id="pause" type="button" aria-pressed="false">暫停</button>
    </div>
  </aside>

  <section class="readouts" aria-label="即時數據">
    <dl class="stats">
      <div><dt class="label">質量</dt><dd>≈<span id="massOut">—</span><small>g</small></dd></div>
      <div><dt class="label">體積</dt><dd><span id="volOut">—</span><small>% 靜止體積</small></dd></div>
      <div><dt class="label">動能</dt><dd><span id="keOut">—</span><small>µJ</small></dd></div>
      <div><dt class="label">塊數</dt><dd><span id="piecesOut">1</span></dd></div>
    </dl>
  </section>

<script src="fox-data.js"></script>
<script type="module">
// ===== geometry.js =====
// ─────────────────────────────────────────────────────────────
//  Geometry shared by every piece: the fox outline traced from the
//  drawing, polygon helpers, Delaunay triangulation, and the barycentric
//  embedding that ties every render vertex to a tetrahedron.
// ─────────────────────────────────────────────────────────────

// one entry per look — outline, texture and its placement — generated from the drawings by
// tools/build_fox_data.py. FOX is the look in use.
const LOOKS = window.FOX_DATA;
let FOX = LOOKS[0];

const SHAPE = {
  T: 0.4,           // thickness
  bevel: 0.06,      // rounding of the top / bottom edges
  inkInset: 0.032,  // walls take their colour from this far inside the outline
};

// seeded PRNG so the specimen is identical on each load
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── polygons in the rest plane: arrays of [u, w], positive area ──
function polyArea(P) {
  let s = 0;
  for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; s += p[0] * q[1] - q[0] * p[1]; }
  return s / 2;
}

function pointInPoly(P, u, w) {
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[j], b = P[i];
    if ((a[1] > w) !== (b[1] > w) && u < a[0] + (b[0] - a[0]) * (w - a[1]) / (b[1] - a[1])) inside = !inside;
  }
  return inside;
}

// signed distance to the outline (negative inside)
function polySD(P, u, w) {
  let d2 = Infinity, inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const a = P[j], b = P[i];
    const ex = b[0] - a[0], ew = b[1] - a[1], px = u - a[0], pw = w - a[1];
    const t = Math.min(1, Math.max(0, (px * ex + pw * ew) / (ex * ex + ew * ew || 1)));
    const dx = px - ex * t, dw = pw - ew * t;
    d2 = Math.min(d2, dx * dx + dw * dw);
    if ((a[1] > w) !== (b[1] > w) && u < a[0] + ex * (w - a[1]) / ew) inside = !inside;
  }
  return inside ? -Math.sqrt(d2) : Math.sqrt(d2);
}

// the same closed outline at even arc-length steps
function resamplePoly(P, spacing) {
  const n = P.length, acc = [0];
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; acc.push(acc[i] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const L = acc[n], m = Math.max(3, Math.round(L / spacing)), out = [];
  for (let k = 0, i = 0; k < m; k++) {
    const s = L * k / m;
    while (acc[i + 1] < s) i++;
    const a = P[i], b = P[(i + 1) % n], t = (s - acc[i]) / (acc[i + 1] - acc[i] || 1);
    out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  return out;
}

// hex lattice points at least `margin` inside the outline, appended to a flat [u, w, …] list
function latticeInto(pts, P, spacing, margin) {
  const n = P.length;
  let u0 = Infinity, u1 = -Infinity, w0 = Infinity, w1 = -Infinity, maxEdge = 0;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const p = P[i];
    u0 = Math.min(u0, p[0]); u1 = Math.max(u1, p[0]); w0 = Math.min(w0, p[1]); w1 = Math.max(w1, p[1]);
    maxEdge = Math.max(maxEdge, Math.hypot(p[0] - P[j][0], p[1] - P[j][1]));
  }
  // edges binned by midpoint, in cells wide enough that anything within `margin` of a point
  // is in its own cell or one of the eight around it
  const cell = margin + maxEdge / 2 + 1e-6, cols = Math.floor((u1 - u0) / cell) + 3;
  const bin = (u, w) => (Math.floor((w - w0) / cell) + 1) * cols + Math.floor((u - u0) / cell) + 1;
  const bins = new Map();
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const k = bin((P[i][0] + P[j][0]) / 2, (P[i][1] + P[j][1]) / 2), l = bins.get(k);
    if (l) l.push(j, i); else bins.set(k, [j, i]);
  }
  const clear = (u, w) => {
    const k = bin(u, w);
    for (let dk = -cols; dk <= cols; dk += cols) for (let d = -1; d <= 1; d++) {
      const l = bins.get(k + dk + d);
      if (!l) continue;
      for (let e = 0; e < l.length; e += 2) {
        const a = P[l[e]], b = P[l[e + 1]];
        const ex = b[0] - a[0], ew = b[1] - a[1], px = u - a[0], pw = w - a[1];
        const t = Math.min(1, Math.max(0, (px * ex + pw * ew) / (ex * ex + ew * ew || 1)));
        if ((px - ex * t) ** 2 + (pw - ew * t) ** 2 < margin * margin) return false;
      }
    }
    return true;
  };
  const dy = spacing * Math.sqrt(3) / 2;
  for (let w = w0 + dy / 2, row = 0; w < w1; w += dy, row++) {
    // where this row crosses the outline: it is inside between each pair of crossings
    const xs = [];
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const a = P[j], b = P[i];
      if ((a[1] > w) !== (b[1] > w)) xs.push(a[0] + (b[0] - a[0]) * (w - a[1]) / (b[1] - a[1]));
    }
    xs.sort((x, y) => x - y);
    const first = u0 + (row % 2) * spacing / 2;
    for (let k = 0; k + 1 < xs.length; k += 2)
      for (let u = first + Math.ceil((xs[k] + margin - first) / spacing) * spacing; u <= xs[k + 1] - margin; u += spacing) if (clear(u, w)) pts.push(u, w);
  }
}

// ── Bowyer–Watson Delaunay. Points go in left to right, so a triangle whose circumcircle
//    lies wholly behind the sweep is finished and never tested again. ──
function delaunay(pts) {
  const n = pts.length / 2;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let i = 0; i < n; i++) {
    minX = Math.min(minX, pts[2 * i]); maxX = Math.max(maxX, pts[2 * i]);
    minY = Math.min(minY, pts[2 * i + 1]); maxY = Math.max(maxY, pts[2 * i + 1]);
  }
  const d = Math.max(maxX - minX, maxY - minY) * 20;
  const mx = (minX + maxX) / 2, my = (minY + maxY) / 2;
  const P = Array.from(pts);
  P.push(mx - d, my - d, mx + d, my - d, mx, my + d);
  const mk = (a, b, c) => {
    const ax = P[2 * a], ay = P[2 * a + 1], bx = P[2 * b], by = P[2 * b + 1], cx = P[2 * c], cy = P[2 * c + 1];
    const D = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
    const a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy;
    const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / D;
    const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / D;
    return { a, b, c, x: ux, y: uy, r2: (ax - ux) ** 2 + (ay - uy) ** 2 };
  };
  const order = Array.from({ length: n }, (_, i) => i).sort((i, j) => P[2 * i] - P[2 * j]);
  let open = [mk(n, n + 1, n + 2)];
  const done = [];
  for (const i of order) {
    const px = P[2 * i], py = P[2 * i + 1];
    const bad = [], keep = [];
    for (const t of open) {
      const dx = px - t.x, r2 = t.r2 * (1 + 1e-9);
      if (dx > 0 && dx * dx > r2) done.push(t);
      else (dx * dx + (py - t.y) ** 2 < r2 ? bad : keep).push(t);
    }
    const edges = new Map();
    for (const t of bad) for (const [e0, e1] of [[t.a, t.b], [t.b, t.c], [t.c, t.a]]) {
      const k = e0 < e1 ? e0 * 100003 + e1 : e1 * 100003 + e0;
      const ex = edges.get(k);
      if (ex) ex.count++; else edges.set(k, { e0, e1, count: 1 });
    }
    open = keep;
    for (const e of edges.values()) if (e.count === 1) open.push(mk(e.e0, e.e1, i));
  }
  const res = [];
  for (const t of done.concat(open)) {
    if (t.a >= n || t.b >= n || t.c >= n) continue;
    // CCW orientation
    const ax = P[2 * t.a], ay = P[2 * t.a + 1];
    const cr = (P[2 * t.b] - ax) * (P[2 * t.c + 1] - ay) - (P[2 * t.b + 1] - ay) * (P[2 * t.c] - ax);
    if (cr > 0) res.push(t.a, t.b, t.c); else res.push(t.a, t.c, t.b);
  }
  return res;
}

// the largest edge-connected patch of a triangle list
function largestPatch(tris) {
  const nT = tris.length / 3, parent = new Int32Array(nT);
  for (let t = 0; t < nT; t++) parent[t] = t;
  const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  const owner = new Map();
  for (let t = 0; t < nT; t++) for (let k = 0; k < 3; k++) {
    const a = tris[3 * t + k], b = tris[3 * t + (k + 1) % 3], key = a < b ? a * 65536 + b : b * 65536 + a;
    const o = owner.get(key);
    if (o === undefined) owner.set(key, t); else parent[find(t)] = find(o);
  }
  const size = new Map();
  let best = -1;
  for (let t = 0; t < nT; t++) { const r = find(t); size.set(r, (size.get(r) || 0) + 1); if (best < 0 || size.get(r) > size.get(best)) best = r; }
  const out = [];
  for (let t = 0; t < nT; t++) if (find(t) === best) out.push(tris[3 * t], tris[3 * t + 1], tris[3 * t + 2]);
  return out;
}

function tetVolume(p, a, b, c, d) {
  const ax = p[3 * a], ay = p[3 * a + 1], az = p[3 * a + 2];
  const b0 = p[3 * b] - ax, b1 = p[3 * b + 1] - ay, b2 = p[3 * b + 2] - az;
  const c0 = p[3 * c] - ax, c1 = p[3 * c + 1] - ay, c2 = p[3 * c + 2] - az;
  const d0 = p[3 * d] - ax, d1 = p[3 * d + 1] - ay, d2 = p[3 * d + 2] - az;
  return (b0 * (c1 * d2 - c2 * d1) - b1 * (c0 * d2 - c2 * d0) + b2 * (c0 * d1 - c1 * d0)) / 6;
}

// ── Barycentric embedding of render vertices into sim tets ──
function embed(simRest, tets, verts) {
  const nT = tets.length / 4, nV = verts.length / 3;
  const cell = 0.1;
  const grid = new Map();
  const key = (i, j, k) => (i + 512) * 1048576 + (j + 512) * 1024 + (k + 512);
  const inv = new Float64Array(nT * 9);
  for (let t = 0; t < nT; t++) {
    let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    const id = [tets[4 * t], tets[4 * t + 1], tets[4 * t + 2], tets[4 * t + 3]];
    for (const v of id) for (let c = 0; c < 3; c++) { mn[c] = Math.min(mn[c], simRest[3 * v + c]); mx[c] = Math.max(mx[c], simRest[3 * v + c]); }
    for (let i = Math.floor(mn[0] / cell); i <= Math.floor(mx[0] / cell); i++)
      for (let j = Math.floor(mn[1] / cell); j <= Math.floor(mx[1] / cell); j++)
        for (let k = Math.floor(mn[2] / cell); k <= Math.floor(mx[2] / cell); k++) {
          const K = key(i, j, k); let l = grid.get(K); if (!l) grid.set(K, l = []); l.push(t);
        }
    // inverse of [b-a, c-a, d-a]
    const a = id[0];
    const m = [];
    for (let c = 1; c < 4; c++) for (let r = 0; r < 3; r++) m.push(simRest[3 * id[c] + r] - simRest[3 * a + r]);
    // m as columns: col0 = m[0..2], col1 = m[3..5], col2 = m[6..8]; build row-major M
    const M = [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
    const det = M[0] * (M[4] * M[8] - M[5] * M[7]) - M[1] * (M[3] * M[8] - M[5] * M[6]) + M[2] * (M[3] * M[7] - M[4] * M[6]);
    const id2 = 1 / det;
    inv[9 * t + 0] = (M[4] * M[8] - M[5] * M[7]) * id2; inv[9 * t + 1] = (M[2] * M[7] - M[1] * M[8]) * id2; inv[9 * t + 2] = (M[1] * M[5] - M[2] * M[4]) * id2;
    inv[9 * t + 3] = (M[5] * M[6] - M[3] * M[8]) * id2; inv[9 * t + 4] = (M[0] * M[8] - M[2] * M[6]) * id2; inv[9 * t + 5] = (M[2] * M[3] - M[0] * M[5]) * id2;
    inv[9 * t + 6] = (M[3] * M[7] - M[4] * M[6]) * id2; inv[9 * t + 7] = (M[1] * M[6] - M[0] * M[7]) * id2; inv[9 * t + 8] = (M[0] * M[4] - M[1] * M[3]) * id2;
  }
  const bary = (t, x, y, z) => {
    const a = tets[4 * t];
    const dx = x - simRest[3 * a], dy = y - simRest[3 * a + 1], dz = z - simRest[3 * a + 2];
    const I = 9 * t;
    const b1 = inv[I] * dx + inv[I + 1] * dy + inv[I + 2] * dz;
    const b2 = inv[I + 3] * dx + inv[I + 4] * dy + inv[I + 5] * dz;
    const b3 = inv[I + 6] * dx + inv[I + 7] * dy + inv[I + 8] * dz;
    return [1 - b1 - b2 - b3, b1, b2, b3];
  };
  const tetOf = new Uint32Array(nV);
  const w = new Float32Array(nV * 4);
  for (let v = 0; v < nV; v++) {
    const x = verts[3 * v], y = verts[3 * v + 1], z = verts[3 * v + 2];
    let best = -1, bestScore = -Infinity, bestB = null;
    const tryT = t => {
      const bb = bary(t, x, y, z);
      const s = Math.min(bb[0], bb[1], bb[2], bb[3]);
      if (s > bestScore) { bestScore = s; best = t; bestB = bb; }
    };
    const ci = Math.floor(x / cell), cj = Math.floor(y / cell), ck = Math.floor(z / cell);
    // widen the search ring by ring: stop once inside a tet, or — past the nearest cells — once
    // a tet is close enough to extrapolate from
    for (let r = 0; r <= 4 && bestScore < (r < 2 ? -1e-4 : -0.3); r++) {
      for (let i = ci - r; i <= ci + r; i++) for (let j = cj - r; j <= cj + r; j++) for (let k = ck - r; k <= ck + r; k++) {
        if (Math.max(Math.abs(i - ci), Math.abs(j - cj), Math.abs(k - ck)) !== r) continue;
        const l = grid.get(key(i, j, k)); if (l) for (const t of l) tryT(t);
      }
    }
    if (best < 0) for (let t = 0; t < nT; t++) tryT(t);
    tetOf[v] = best; w.set(bestB, 4 * v);
  }
  return { tetOf, w };
}

// ===== knife.js =====
// ─────────────────────────────────────────────────────────────
//  The knife: a small nakiri-style vegetable knife
//  local frame: +x along the blade toward the tip, +y up, edge on y = 0,
//  blade face normals ±z. The handle runs along −x.
//  materials: 3.0 ground edge bevel · 3.45 blade flat · 3.7 bolster · 5 handle
// ─────────────────────────────────────────────────────────────

const KNIFE = {
  Lb: 1.72,        // blade length
  H: 0.63,        // blade height at the heel
  xr: 0.86,       // reference point on the edge that follows the cut (blade middle)
  handleLen: 0.84,
};

function knifeHandleCentre(p) { return 0.56 - 0.028 * p * p; } // p ∈ [0,1] from bolster to butt

function buildKnifeMesh() {
  const { Lb, H } = KNIFE;
  const pos = [], mat = [], idx = [], hint = [];
  const add = (x, y, z, m) => { pos.push(x, y, z); mat.push(m); return pos.length / 3 - 1; };
  // add a triangle, flipping its winding if needed so it faces along `out`
  const tri = (a, b, c, out) => {
    const P = i => [pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]];
    const A = P(a), B = P(b), C = P(c);
    const e1 = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], e2 = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
    const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    if (n[0] * out[0] + n[1] * out[1] + n[2] * out[2] < 0) idx.push(a, c, b); else idx.push(a, b, c);
  };
  const quad = (a, b, c, d, out) => { tri(a, b, c, out); tri(a, c, d, out); };

  // ── blade ──
  // profile: straight edge with a small lift at the very front, flat spine that drops into a rounded nose
  const bottom = u => { const s = Math.max(0, (u - 0.86) / 0.14); return 0.06 * s * s; };
  const top = u => { const s = Math.max(0, (u - 0.72) / 0.28); return H * (1 - 0.05 * u) - H * 0.34 * Math.pow(s, 2.2); };
  // half thickness across the height: thin ground bevel, then a flat grind to the spine
  const half = (u, v) => {
    const taper = 1 - 0.45 * Math.max(0, (u - 0.7) / 0.3);
    const t = v < 0.2 ? 0.0009 + (0.0062 - 0.0009) * (v / 0.2) : 0.0062 + 0.0095 * Math.pow((v - 0.2) / 0.8, 0.9);
    return t * taper;
  };
  const vs = [0, 0.05, 0.11, 0.16, 0.2, 0.215, 0.3, 0.45, 0.6, 0.75, 0.88, 0.95, 1];
  const nu = 44;
  const us = []; for (let i = 0; i <= nu; i++) us.push(i / nu);
  const grid = { 1: [], [-1]: [] };
  for (const sg of [1, -1]) {
    for (let i = 0; i <= nu; i++) {
      const u = us[i], row = [];
      for (const v of vs) {
        const y = bottom(u) + (top(u) - bottom(u)) * v;
        row.push(add(u * Lb, y, sg * half(u, v), v <= 0.2 ? 3.0 : 3.45));
      }
      grid[sg].push(row);
    }
    for (let i = 0; i < nu; i++) for (let j = 0; j < vs.length - 1; j++)
      quad(grid[sg][i][j], grid[sg][i + 1][j], grid[sg][i + 1][j + 1], grid[sg][i][j + 1], [0, 0, sg]);
  }
  const J = vs.length - 1;
  // spine, edge, nose and heel strips (duplicated vertices so the creases stay sharp)
  const strip = (getA, getB, count, outFn, m) => {
    let pa = null, pb = null;
    for (let i = 0; i <= count; i++) {
      const A = getA(i), B = getB(i);
      const a = add(A[0], A[1], A[2], m), b = add(B[0], B[1], B[2], m);
      if (pa !== null) quad(pa, a, b, pb, outFn(i));
      pa = a; pb = b;
    }
  };
  const P = i => [pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]];
  strip(i => P(grid[1][i][J]), i => P(grid[-1][i][J]), nu, i => { const u = us[i]; return [-(top(Math.min(1, u + 0.01)) - top(u)) / (0.01 * Lb), 1, 0]; }, 3.45);
  strip(i => P(grid[1][i][0]), i => P(grid[-1][i][0]), nu, () => [0, -1, 0], 3.0);
  strip(j => P(grid[1][nu][j]), j => P(grid[-1][nu][j]), J, () => [1, 0, 0], 3.45);
  strip(j => P(grid[1][0][j]), j => P(grid[-1][0][j]), J, () => [-1, 0, 0], 3.45);

  // ── bolster: a short polished block between blade and handle ──
  const box = (x0, x1, y0, y1, z0, z1, m) => {
    const c = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    const faces = [[0, 1, 2, 3, [0, 0, -1]], [4, 5, 6, 7, [0, 0, 1]], [0, 1, 5, 4, [0, -1, 0]], [3, 2, 6, 7, [0, 1, 0]], [0, 3, 7, 4, [-1, 0, 0]], [1, 2, 6, 5, [1, 0, 0]]];
    for (const [a, b, cc, d, out] of faces) {
      const ia = add(...c[a], m), ib = add(...c[b], m), ic = add(...c[cc], m), id = add(...c[d], m);
      quad(ia, ib, ic, id, out);
    }
  };
  box(-0.07, 0.004, 0.45, H * 0.985, -0.026, 0.026, 3.7);

  // ── handle: slightly swelling oval section, dropping a touch toward the butt ──
  const L = KNIFE.handleLen, NR = 26, NT = 22, x0 = -0.07;
  const ring = [];
  const sec = p => ({ c: knifeHandleCentre(p), a: 0.08 * (1 + 0.1 * Math.sin(Math.PI * p) + 0.05 * p), b: 0.054 * (1 + 0.14 * Math.sin(Math.PI * p)) });
  for (let i = 0; i <= NR; i++) {
    const p = i / NR, x = x0 - p * L, s = sec(p), r = [];
    for (let k = 0; k < NT; k++) {
      const th = k / NT * Math.PI * 2;
      r.push(add(x, s.c + Math.sin(th) * s.a, Math.cos(th) * s.b, 5));
    }
    ring.push(r);
  }
  for (let i = 0; i < NR; i++) for (let k = 0; k < NT; k++) {
    const k2 = (k + 1) % NT;
    const a = ring[i][k], b = ring[i + 1][k], c = ring[i + 1][k2], d = ring[i][k2];
    const A = P(a); const cy = sec(i / NR).c;
    quad(a, b, c, d, [0, A[1] - cy, A[2]]);
  }
  // end caps (flat)
  for (const [p, dir] of [[0, 1], [1, -1]]) {
    const i = Math.round(p * NR), x = x0 - p * L, s = sec(p);
    const centre = add(x + dir * 0.004, s.c, 0, 5);
    const rim = ring[i].map(v => add(...P(v), 5));
    for (let k = 0; k < NT; k++) tri(centre, rim[k], rim[(k + 1) % NT], [dir, 0, 0]);
  }

  // smooth normals per vertex (creases come from the duplicated vertices)
  const nV = pos.length / 3, nrm = new Float32Array(nV * 3);
  for (let t = 0; t < idx.length; t += 3) {
    const a = idx[t], b = idx[t + 1], c = idx[t + 2];
    const A = P(a), B = P(b), C = P(c);
    const e1 = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], e2 = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
    const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    for (const v of [a, b, c]) { nrm[3 * v] += n[0]; nrm[3 * v + 1] += n[1]; nrm[3 * v + 2] += n[2]; }
  }
  for (let v = 0; v < nV; v++) {
    const l = Math.hypot(nrm[3 * v], nrm[3 * v + 1], nrm[3 * v + 2]) || 1;
    nrm[3 * v] /= l; nrm[3 * v + 1] /= l; nrm[3 * v + 2] /= l;
  }
  return { rest: new Float32Array(pos), nrm, mat: new Float32Array(mat), index: new Uint32Array(idx) };
}

// ===== pieces.js =====
// ─────────────────────────────────────────────────────────────
//  Pieces: the fox and everything cut from it.
//  Every piece is a simple polygon P in the fox's rest plane (u, w) — its
//  outline seen from above. All pieces share one rest frame, so the drawing
//  stays exactly where it was on every one of them.
// ─────────────────────────────────────────────────────────────

const MIN_AREA = 0.02;        // a cut may not leave crumbs smaller than this…
const MIN_WIDTH = 0.05;       // …or slivers thinner than this (2 · area / perimeter)
const CUT_ROUND = 0.05;       // corner radius where a cut meets the outline
const OUTLINE_STEP = 0.022;   // vertex spacing of a piece outline

function initialPiece() {
  const P = [];
  for (let i = 0; i < FOX.outline.length; i += 2) P.push([FOX.outline[i], FOX.outline[i + 1]]);
  return { P, cache: null };
}

// Split a piece along the rest-plane line a·u + b·w = c (a, b normalised), where the stroke —
// t0 to t1 along the line — passes through it. The crossings, sorted along the line, pair up into
// chords through the interior; walking the outline and jumping across each chord gives the loops
// on either side. A chord that would shave off a crumb is left uncut.
// Returns null if the line misses the piece, [] if nothing can be cut there.
function splitPiece(P, a, b, c, t0 = -Infinity, t1 = Infinity) {
  const n = P.length, s = new Float64Array(n);
  for (let i = 0; i < n; i++) { const v = a * P[i][0] + b * P[i][1] - c; s[i] = Math.abs(v) < 1e-7 ? 1e-7 : v; }
  const ring = [], cross = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    ring.push({ p: P[i], chord: -1 });
    if (s[i] * s[j] < 0) {
      const f = s[i] / (s[i] - s[j]);
      const p = [P[i][0] + (P[j][0] - P[i][0]) * f, P[i][1] + (P[j][1] - P[i][1]) * f];
      cross.push({ at: ring.length, t: a * p[1] - b * p[0] });
      ring.push({ p, chord: -1 });
    }
  }
  if (cross.length < 2) return null;
  cross.sort((x, y) => x.t - y.t);
  let chords = [];
  for (let k = 0; k + 1 < cross.length; k += 2) if (cross[k + 1].t > t0 && cross[k].t < t1) chords.push([cross[k].at, cross[k + 1].at]);
  while (chords.length) {
    for (const v of ring) v.chord = -1;
    chords.forEach(([x, y], k) => { ring[x].chord = k; ring[y].chord = k; });
    const seen = new Uint8Array(ring.length), loops = [];
    for (let e0 = 0; e0 < ring.length; e0++) {
      if (seen[e0]) continue;
      const V = [], corner = [], used = new Set();
      let i = e0;
      do {
        seen[i] = 1;
        V.push(ring[i].p); corner.push(ring[i].chord >= 0);
        let v = (i + 1) % ring.length;
        const k = ring[v].chord;
        // arriving at a crossing: take the chord and carry on along the outline from its far end
        if (k >= 0) { V.push(ring[v].p); corner.push(true); used.add(k); v = chords[k][0] === v ? chords[k][1] : chords[k][0]; }
        i = v;
      } while (i !== e0);
      loops.push({ V, corner, used });
    }
    const crumb = loops.find(l => {
      const A = polyArea(l.V);
      let per = 0;
      for (let i = 0; i < l.V.length; i++) { const p = l.V[i], q = l.V[(i + 1) % l.V.length]; per += Math.hypot(q[0] - p[0], q[1] - p[1]); }
      return A < MIN_AREA || 2 * A / per < MIN_WIDTH;
    });
    if (!crumb) return loops.map(l => roundCorners(l.V, l.corner, CUT_ROUND, OUTLINE_STEP));
    chords = chords.filter((_, k) => !crumb.used.has(k));
  }
  return [];
}

// soften the corners a cut leaves behind — each becomes a short curve tangent to both sides —
// then resample the whole outline evenly
function roundCorners(V, corner, radius, step) {
  const n = V.length, acc = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) { const p = V[i], q = V[(i + 1) % n]; acc[i + 1] = acc[i] + Math.hypot(q[0] - p[0], q[1] - p[1]); }
  const L = acc[n];
  const at = s => {
    s = ((s % L) + L) % L;
    let lo = 0, hi = n;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (acc[m] <= s) lo = m; else hi = m; }
    const p = V[lo], q = V[(lo + 1) % n], f = (s - acc[lo]) / (acc[lo + 1] - acc[lo] || 1);
    return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f];
  };
  const gap = (i, j) => (acc[j] - acc[i] + L) % L || L;   // arc length from vertex i forward to vertex j
  const C = [];
  for (let i = 0; i < n; i++) if (corner[i]) C.push(i);
  const r = C.map((c, k) => Math.min(radius, 0.45 * gap(C[(k + C.length - 1) % C.length], c), 0.45 * gap(c, C[(k + 1) % C.length])));
  const out = [];
  C.forEach((c, k) => {
    const A = at(acc[c] - r[k]), B = at(acc[c] + r[k]), nk = (k + 1) % C.length;
    for (let j = 0; j <= 4; j++) {
      const f = j / 4, g = 1 - f;
      out.push([g * g * A[0] + 2 * g * f * V[c][0] + f * f * B[0], g * g * A[1] + 2 * g * f * V[c][1] + f * f * B[1]]);
    }
    for (let i = (c + 1) % n; i !== C[nk]; i = (i + 1) % n) if (gap(c, i) > r[k] && gap(i, C[nk]) > r[nk]) out.push(V[i]);
  });
  return resamplePoly(out, step);
}

// ── per-piece simulation mesh: Delaunay inside the outline, extruded into prisms → tets ──
// Small pieces get a finer mesh; null if the outline is too thin to fill at all.
function buildPieceSim(P, layers = 3) {
  const { T } = SHAPE, area = polyArea(P);
  let pts = null, tris = null;
  for (let h = 0.15, tries = 0; tries < 5; tries++, h *= 0.72) {
    // outline points, skipping any that crowd an earlier one (the two sides of a thin spike)
    pts = [];
    for (const p of resamplePoly(P, h)) {
      let dup = false;
      for (let j = 0; j < pts.length; j += 2) if (Math.hypot(pts[j] - p[0], pts[j + 1] - p[1]) < h * 0.45) { dup = true; break; }
      if (!dup) pts.push(p[0], p[1]);
    }
    latticeInto(pts, P, h, h * 0.55);
    const all = delaunay(pts), keep = [];
    for (let i = 0; i < all.length; i += 3) {
      const a = all[i], b = all[i + 1], c = all[i + 2];
      const ax = pts[2 * a], ay = pts[2 * a + 1], bx = pts[2 * b], by = pts[2 * b + 1], cx = pts[2 * c], cy = pts[2 * c + 1];
      const ar = Math.abs((bx - ax) * (cy - ay) - (by - ay) * (cx - ax)) / 2;
      const l2 = Math.max((bx - ax) ** 2 + (by - ay) ** 2, (cx - bx) ** 2 + (cy - by) ** 2, (ax - cx) ** 2 + (ay - cy) ** 2);
      // inside the outline, and not a sliver of nearly collinear outline points
      if (ar / l2 > 0.08 && pointInPoly(P, (ax + bx + cx) / 3, (ay + by + cy) / 3)) keep.push(a, b, c);
    }
    tris = largestPatch(keep);
    let covered = 0;
    for (let i = 0; i < tris.length; i += 3) {
      const a = tris[i], b = tris[i + 1], c = tris[i + 2];
      covered += Math.abs((pts[2 * b] - pts[2 * a]) * (pts[2 * c + 1] - pts[2 * a + 1]) - (pts[2 * b + 1] - pts[2 * a + 1]) * (pts[2 * c] - pts[2 * a])) / 2;
    }
    if (tris.length >= 36 && covered > 0.92 * area) break;
  }
  if (tris.length < 9) return null;
  // keep only vertices referenced
  const used = new Int32Array(pts.length / 2).fill(-1);
  const v2 = [];
  for (const v of tris) if (used[v] < 0) { used[v] = v2.length / 2; v2.push(pts[2 * v], pts[2 * v + 1]); }
  tris = tris.map(v => used[v]);
  const n2 = v2.length / 2, nL = layers + 1;
  const rest = new Float32Array(n2 * nL * 3);
  for (let l = 0; l < nL; l++) for (let i = 0; i < n2; i++) {
    const k = (l * n2 + i) * 3;
    rest[k] = v2[2 * i]; rest[k + 1] = T * l / layers; rest[k + 2] = v2[2 * i + 1];
  }
  const tets = [];
  for (let l = 0; l < layers; l++) for (let i = 0; i < tris.length; i += 3) {
    const s = [tris[i], tris[i + 1], tris[i + 2]].sort((x, y) => x - y);
    const a = l * n2 + s[0], b = l * n2 + s[1], c = l * n2 + s[2];
    tets.push(a, b, c, a + n2, b, c, a + n2, b + n2, c, a + n2, b + n2, c + n2);
  }
  for (let t = 0; t < tets.length; t += 4) if (tetVolume(rest, tets[t], tets[t + 1], tets[t + 2], tets[t + 3]) < 0) { const tmp = tets[t + 2]; tets[t + 2] = tets[t + 3]; tets[t + 3] = tmp; }
  // one material throughout
  return { rest, tets: new Uint32Array(tets), region: new Uint8Array(n2 * nL) };
}

// ── air bubbles, scattered once per look in the shared rest frame ──
function globalBubbles() {
  if (FOX.bubbles) return FOX.bubbles;
  const { T } = SHAPE, R = rng(10), P = initialPiece().P, list = [];
  let u0 = Infinity, u1 = -Infinity, w0 = Infinity, w1 = -Infinity;
  for (const p of P) { u0 = Math.min(u0, p[0]); u1 = Math.max(u1, p[0]); w0 = Math.min(w0, p[1]); w1 = Math.max(w1, p[1]); }
  const bs = 8, bp = 12;
  for (let tries = 0; list.length < 14 && tries < 400; tries++) {
    const x = u0 + R() * (u1 - u0), z = w0 + R() * (w1 - w0);
    const r = 0.009 + R() * R() * 0.02, y = R() < 0.6 ? T - 0.04 - R() * 0.14 : 0.05 + R() * 0.12;
    if (polySD(P, x, z) > -0.14) continue;
    const pos = [], nrm = [], idx = [];
    for (let i = 0; i <= bs; i++) {
      const t = Math.PI * i / bs;
      for (let j = 0; j < bp; j++) {
        const ph = 2 * Math.PI * j / bp;
        const nx = Math.sin(t) * Math.cos(ph), ny = Math.cos(t), nz = Math.sin(t) * Math.sin(ph);
        pos.push(x + nx * r, y + ny * r, z + nz * r); nrm.push(nx, ny, nz);
      }
    }
    for (let i = 0; i < bs; i++) for (let j = 0; j < bp; j++) {
      const a = i * bp + j, bb = i * bp + (j + 1) % bp, c = a + bp, d = bb + bp;
      idx.push(a, bb, c, bb, d, c);
    }
    list.push({ cx: x, cz: z, rad: r, pos, nrm, idx });
  }
  FOX.bubbles = list;
  return list;
}

// outline samples for the render mesh: position p, outward normal n, and b — how far the bevel
// reaches inward there. b is the full SHAPE.bevel wherever a disc of that radius fits behind the
// outline, and narrows in ear tips and tufts of fur so the inset outline never folds over itself.
function pieceSamples(P, spacing) {
  const V = resamplePoly(P, spacing), N = V.length, S = [];
  for (let i = 0; i < N; i++) {
    const p = V[i], q0 = V[(i + N - 1) % N], q1 = V[(i + 1) % N];
    const tx = q1[0] - q0[0], tw = q1[1] - q0[1], l = Math.hypot(tx, tw) || 1;
    const n = [tw / l, -tx / l];
    let b = SHAPE.bevel;
    while (b > SHAPE.bevel * 0.15 && polySD(V, p[0] - n[0] * b, p[1] - n[1] * b) > -0.9 * b) b *= 0.78;
    S.push({ p, n, b });
  }
  // ease the changes in b along the outline
  for (let pass = 0; pass < 3; pass++) {
    const prev = S.map(s => s.b);
    for (let i = 0; i < N; i++) S[i].b = Math.min(prev[i], (prev[(i + N - 1) % N] + prev[i] + prev[(i + 1) % N]) / 3);
  }
  return S;
}

// Delaunay of a closed ring of points plus a hex lattice inside it, keeping the triangles that
// lie inside the ring. `missing` lists the ring edges the triangulation did not follow.
function triangulateRing(R, spacing) {
  const N = R.length, pts = [];
  for (const p of R) pts.push(p[0], p[1]);
  latticeInto(pts, R, spacing, spacing * 0.6);
  const all = delaunay(pts), tris = [], edges = new Set();
  const key = (a, b) => (a < b ? a * 65536 + b : b * 65536 + a);
  for (let i = 0; i < all.length; i += 3) {
    const a = all[i], b = all[i + 1], c = all[i + 2];
    edges.add(key(a, b)); edges.add(key(b, c)); edges.add(key(c, a));
    if (pointInPoly(R, (pts[2 * a] + pts[2 * b] + pts[2 * c]) / 3, (pts[2 * a + 1] + pts[2 * b + 1] + pts[2 * c + 1]) / 3)) tris.push(a, b, c);
  }
  const missing = [];
  for (let i = 0; i < N; i++) if (!edges.has(key(i, (i + 1) % N))) missing.push(i);
  return { pts, tris, missing };
}

// ── per-piece render mesh: beveled walls, two caps, and the bubbles that lie inside it ──
// material ids: 0 body, 2 bubble. Each vertex also carries the point of the drawing it shows.
function buildPieceRender(P) {
  const { T, bevel: bv } = SHAPE;
  const pos = [], tex = [], nrm = [], mat = [], body = [], bubbles = [];
  const add = (x, y, z, tu, tw, m, nx, ny, nz) => { pos.push(x, y, z); tex.push(tu, tw); nrm.push(nx, ny, nz); mat.push(m); return pos.length / 3 - 1; };
  // outline samples, with extra ones wherever the cap triangulation cut across the inset outline
  let S = pieceSamples(P, 0.03), cap;
  for (let pass = 0; ; pass++) {
    cap = triangulateRing(S.map(s => [s.p[0] - s.n[0] * s.b, s.p[1] - s.n[1] * s.b]), 0.048);
    if (!cap.missing.length || pass === 3) break;
    const miss = new Set(cap.missing), next = [];
    S.forEach((s, i) => {
      next.push(s);
      if (!miss.has(i)) return;
      const q = S[(i + 1) % S.length], nx = s.n[0] + q.n[0], nw = s.n[1] + q.n[1], l = Math.hypot(nx, nw) || 1;
      next.push({ p: [(s.p[0] + q.p[0]) / 2, (s.p[1] + q.p[1]) / 2], n: [nx / l, nw / l], b: (s.b + q.b) / 2 });
    });
    S = next;
  }
  const N = S.length;
  // wall rings from the floor up: bottom bevel quarter, straight band, top bevel quarter.
  // k is the fraction of the bevel reach b that the ring is inset by.
  const qb = 8, qs = 3, rings = [];
  for (let j = 0; j <= qb; j++) { const ps = -Math.PI / 2 + (Math.PI / 2) * j / qb; rings.push({ k: 1 - Math.cos(ps), y: bv + bv * Math.sin(ps), ny: Math.sin(ps), nr: Math.cos(ps) }); }
  for (let j = 1; j < qs; j++) rings.push({ k: 0, y: bv + (T - 2 * bv) * j / qs, ny: 0, nr: 1 });
  for (let j = 0; j <= qb; j++) { const ps = (Math.PI / 2) * j / qb; rings.push({ k: 1 - Math.cos(ps), y: T - bv + bv * Math.sin(ps), ny: Math.sin(ps), nr: Math.cos(ps) }); }
  const ringStart = [];
  for (const r of rings) {
    ringStart.push(pos.length / 3);
    for (const s of S) {
      // the wall shows the colours just inside the outline, not the drawn contour itself
      const d = s.b * r.k, dc = Math.max(d, Math.min(SHAPE.inkInset, s.b));
      add(s.p[0] - s.n[0] * d, r.y, s.p[1] - s.n[1] * d, s.p[0] - s.n[0] * dc, s.p[1] - s.n[1] * dc, 0, s.n[0] * r.nr, r.ny, s.n[1] * r.nr);
    }
  }
  for (let j = 0; j < rings.length - 1; j++) for (let k = 0; k < N; k++) {
    const a = ringStart[j] + k, bb = ringStart[j] + (k + 1) % N, c = ringStart[j + 1] + k, d = ringStart[j + 1] + (k + 1) % N;
    body.push(a, c, bb, bb, c, d);
  }
  // caps: the first N cap points are the innermost wall rings, the rest are new
  const topRing = ringStart[rings.length - 1], botRing = ringStart[0], topMap = [], botMap = [];
  for (let i = 0; i < cap.pts.length / 2; i++) {
    if (i < N) { topMap.push(topRing + i); botMap.push(botRing + i); continue; }
    const x = cap.pts[2 * i], z = cap.pts[2 * i + 1];
    topMap.push(add(x, T, z, x, z, 0, 0, 1, 0)); botMap.push(add(x, 0, z, x, z, 0, 0, -1, 0));
  }
  for (let i = 0; i < cap.tris.length; i += 3) {
    const a = cap.tris[i], c1 = cap.tris[i + 1], c2 = cap.tris[i + 2];
    body.push(topMap[a], topMap[c2], topMap[c1]);
    body.push(botMap[a], botMap[c1], botMap[c2]);
  }
  // bubbles that sit wholly inside this piece
  for (const bu of globalBubbles()) {
    if (polySD(P, bu.cx, bu.cz) + bu.rad > -0.03) continue;
    const base = pos.length / 3;
    for (let k = 0; k < bu.pos.length; k += 3) add(bu.pos[k], bu.pos[k + 1], bu.pos[k + 2], bu.cx, bu.cz, 2, bu.nrm[k], bu.nrm[k + 1], bu.nrm[k + 2]);
    for (const v of bu.idx) bubbles.push(base + v);
  }
  // windings agree with analytic outward normals (CCW = front)
  for (const idx of [body, bubbles]) for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i], b1 = idx[i + 1], c = idx[i + 2];
    const e1x = pos[3 * b1] - pos[3 * a], e1y = pos[3 * b1 + 1] - pos[3 * a + 1], e1z = pos[3 * b1 + 2] - pos[3 * a + 2];
    const e2x = pos[3 * c] - pos[3 * a], e2y = pos[3 * c + 1] - pos[3 * a + 1], e2z = pos[3 * c + 2] - pos[3 * a + 2];
    const fx = e1y * e2z - e1z * e2y, fy = e1z * e2x - e1x * e2z, fz = e1x * e2y - e1y * e2x;
    let d = 0;
    for (const v of [a, b1, c]) d += fx * nrm[3 * v] + fy * nrm[3 * v + 1] + fz * nrm[3 * v + 2];
    if (d < 0) { idx[i + 1] = c; idx[i + 2] = b1; }
  }
  return { rest: new Float32Array(pos), tex: new Float32Array(tex), mat: new Float32Array(mat), body, bubbles };
}

// meshes for one piece, built once; null if the piece is too thin to simulate
function ensureCache(piece) {
  if (piece.cache) return piece.cache;
  const sim = buildPieceSim(piece.P);
  if (!sim) return null;
  const ren = buildPieceRender(piece.P);
  const emb = embed(sim.rest, sim.tets, ren.rest);
  piece.cache = { sim, ren, emb };
  return piece.cache;
}

// ── the world: every piece concatenated into one simulation and one render mesh ──
function buildWorld(pieces) {
  let nP = 0, nT = 0, nV = 0, nB = 0, nU = 0;
  for (const p of pieces) {
    const c = ensureCache(p);
    nP += c.sim.rest.length / 3; nT += c.sim.tets.length / 4; nV += c.ren.rest.length / 3;
    nB += c.ren.body.length; nU += c.ren.bubbles.length;
  }
  const rest = new Float32Array(nP * 3), tets = new Uint32Array(nT * 4), region = new Uint8Array(nP), comp = new Uint16Array(nP);
  const rRest = new Float32Array(nV * 3), rTex = new Float32Array(nV * 2), rMat = new Float32Array(nV), vComp = new Uint16Array(nV);
  const index = new Uint32Array(nB + nU);
  const skinIdx = new Uint32Array(nV * 4), skinW = new Float32Array(nV * 4);
  let po = 0, to = 0, vo = 0, bo = 0, uo = nB;
  pieces.forEach((p, k) => {
    const { sim, ren, emb } = p.cache;
    const np = sim.rest.length / 3, nt = sim.tets.length / 4, nv = ren.rest.length / 3;
    rest.set(sim.rest, po * 3); region.set(sim.region, po); comp.fill(k, po, po + np);
    for (let i = 0; i < nt * 4; i++) tets[to * 4 + i] = sim.tets[i] + po;
    rRest.set(ren.rest, vo * 3); rTex.set(ren.tex, vo * 2); rMat.set(ren.mat, vo); vComp.fill(k, vo, vo + nv);
    for (let v = 0; v < nv; v++) for (let j = 0; j < 4; j++) {
      skinIdx[(vo + v) * 4 + j] = sim.tets[4 * emb.tetOf[v] + j] + po;
      skinW[(vo + v) * 4 + j] = emb.w[4 * v + j];
    }
    for (const i of ren.body) index[bo++] = i + vo;
    for (const i of ren.bubbles) index[uo++] = i + vo;
    po += np; to += nt; vo += nv;
  });
  return {
    sim: { rest, tets, region, comp, nComp: pieces.length },
    render: {
      rest: rRest, tex: rTex, mat: rMat, index, vComp,
      body: { first: 0, count: nB }, bubbles: { first: nB, count: nU },
    },
    skinIdx, skinW,
  };
}

// ===== physics.js =====
// ─────────────────────────────────────────────────────────────
//  XPBD tetrahedral soft body
//  · co-rotational tet constraints → elasticity (each tet pulled toward its
//                                    best-fit rotated rest shape; recovers inversions)
//  · tet volume constraints        → near-incompressibility
//  · soft grab attachment, ground contact with friction
//  · relative-velocity damping along edges (internal viscosity)
//  Fixed step, fixed substeps, "small steps" XPBD (1 iteration / substep).
// ─────────────────────────────────────────────────────────────

class SoftBody {
  constructor(mesh, opts = {}) {
    const { rest, tets, region } = mesh;
    this.comp = mesh.comp || new Uint16Array(rest.length / 3);
    this.subIndex = 0;
    this.nComp = mesh.nComp || 1;
    this.n = rest.length / 3;
    this.nT = tets.length / 4;
    this.tets = tets;
    this.rest = Float32Array.from(rest);
    this.x = new Float32Array(rest.length);
    this.prev = new Float32Array(rest.length);
    this.v = new Float32Array(rest.length);
    this.invMass = new Float32Array(this.n);
    this.mass = new Float32Array(this.n);
    this.restVol = new Float32Array(this.nT);
    this.region = region;
    this.density = 1.0;

    // masses from rest volumes
    let vol = 0;
    for (let t = 0; t < this.nT; t++) {
      const v = this.tetVol(this.rest, t);
      this.restVol[t] = v; vol += v;
      for (let k = 0; k < 4; k++) this.mass[tets[4 * t + k]] += v * this.density / 4;
    }
    this.totalRestVolume = vol;
    this.totalMass = 0;
    for (let i = 0; i < this.n; i++) { this.invMass[i] = 1 / this.mass[i]; this.totalMass += this.mass[i]; }

    // unique edges
    const set = new Map();
    const pairs = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    for (let t = 0; t < this.nT; t++) for (const [a, b] of pairs) {
      let i = tets[4 * t + a], j = tets[4 * t + b];
      if (i > j) [i, j] = [j, i];
      set.set(i * 65536 + j, [i, j]);
    }
    this.nE = set.size;
    this.edges = new Uint32Array(this.nE * 2);
    this.restLen = new Float32Array(this.nE);
    let e = 0;
    for (const [i, j] of set.values()) {
      this.edges[2 * e] = i; this.edges[2 * e + 1] = j;
      this.restLen[e] = Math.hypot(rest[3 * i] - rest[3 * j], rest[3 * i + 1] - rest[3 * j + 1], rest[3 * i + 2] - rest[3 * j + 2]);
      e++;
    }
    // shuffle edge order a little (reduces Gauss–Seidel directional bias)
    for (let k = this.nE - 1; k > 0; k--) {
      const r = (k * 2654435761) % (k + 1);
      for (const arr of [this.edges]) { const a0 = arr[2 * k], a1 = arr[2 * k + 1]; arr[2 * k] = arr[2 * r]; arr[2 * k + 1] = arr[2 * r + 1]; arr[2 * r] = a0; arr[2 * r + 1] = a1; }
      const tmp = this.restLen[k]; this.restLen[k] = this.restLen[r]; this.restLen[r] = tmp;
    }

    // co-rotational tet elasticity: rest shape, inverse rest matrix, warm-started rotation
    this.tetQ = new Float32Array(this.nT * 12);     // rest positions relative to tet centroid
    this.tetDmInv = new Float32Array(this.nT * 9);
    this.tetRot = new Float32Array(this.nT * 4);    // quaternion (x, y, z, w)
    this.tetFirm = new Float32Array(this.nT);
    for (let t = 0; t < this.nT; t++) {
      const id = [tets[4 * t], tets[4 * t + 1], tets[4 * t + 2], tets[4 * t + 3]];
      let cx = 0, cy = 0, cz = 0, M = 0;
      for (const v of id) { const mv = this.mass[v]; M += mv; cx += rest[3 * v] * mv; cy += rest[3 * v + 1] * mv; cz += rest[3 * v + 2] * mv; }
      cx /= M; cy /= M; cz /= M;
      for (let k = 0; k < 4; k++) {
        this.tetQ[12 * t + 3 * k] = rest[3 * id[k]] - cx;
        this.tetQ[12 * t + 3 * k + 1] = rest[3 * id[k] + 1] - cy;
        this.tetQ[12 * t + 3 * k + 2] = rest[3 * id[k] + 2] - cz;
      }
      // Dm columns: X1-X0, X2-X0, X3-X0 → store inverse row-major
      const m = [];
      for (let r = 0; r < 3; r++) for (let c = 1; c < 4; c++) m.push(rest[3 * id[c] + r] - rest[3 * id[0] + r]);
      const inv = inv3(m);
      this.tetDmInv.set(inv, 9 * t);
      this.tetRot[4 * t + 3] = 1;
      let rg = 0; for (const v of id) rg += region[v];
      this.tetFirm[t] = rg >= 6 ? 0.3 : rg >= 3 ? 0.5 : rg >= 1 ? 0.75 : 1.0;
    }

    // parameters (tuned in sim units: metres-ish, seconds)
    this.gravity = -9.81;
    this.firmness = opts.firmness ?? 0.5;   // 0..1 UI value
    this.damping = opts.damping ?? 0.45;    // 0..1 UI value
    this.substeps = 10;
    this.stepDt = 1 / 60;
    this.friction = 0.55;
    this.floorY = 0;
    this.maxSpeed = 12;

    // whole-piece shape memory (see solveShape): rest centroid and mass per piece, a warm-started
    // rotation, how far a particle may stray before it is drawn back at all, and how strongly
    this.shapeHold = 0.03;
    this.shapeSlack = 0.08;
    this.shapePull = new Float32Array(this.n * 3);
    this.compMass = new Float64Array(this.nComp);
    this.compRest = new Float64Array(this.nComp * 3);
    for (let i = 0; i < this.n; i++) {
      const c = this.comp[i], m = this.mass[i];
      this.compMass[c] += m;
      for (let k = 0; k < 3; k++) this.compRest[3 * c + k] += m * rest[3 * i + k];
    }
    for (let c = 0; c < this.nComp; c++) for (let k = 0; k < 3; k++) this.compRest[3 * c + k] /= this.compMass[c];
    this.compRot = new Float64Array(this.nComp * 4);
    for (let c = 0; c < this.nComp; c++) this.compRot[4 * c + 3] = 1;
    this.compRotWarm = false;
    this.compAcc = new Float64Array(this.nComp * 12);

    this.blade = null;
    // grab state
    this.grabIdx = new Int32Array(this.n);
    this.grabW = new Float32Array(this.n);
    this.grabOff = new Float32Array(this.n * 3);
    this.grabN = 0;
    this.grabTarget = new Float32Array(3);
    this.grabPos = new Float32Array(3);     // where the hand is now: chases grabTarget
    this.grabSpeed = 9;
    this.grabRot = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
    this.grabbing = false;

    this.time = 0;
    this.reset(0);
  }

  tetVol(p, t) {
    const T = this.tets;
    const a = T[4 * t], b = T[4 * t + 1], c = T[4 * t + 2], d = T[4 * t + 3];
    const ax = p[3 * a], ay = p[3 * a + 1], az = p[3 * a + 2];
    const b0 = p[3 * b] - ax, b1 = p[3 * b + 1] - ay, b2 = p[3 * b + 2] - az;
    const c0 = p[3 * c] - ax, c1 = p[3 * c + 1] - ay, c2 = p[3 * c + 2] - az;
    const d0 = p[3 * d] - ax, d1 = p[3 * d + 1] - ay, d2 = p[3 * d + 2] - az;
    return (b0 * (c1 * d2 - c2 * d1) - b1 * (c0 * d2 - c2 * d0) + b2 * (c0 * d1 - c1 * d0)) / 6;
  }

  reset(drop = 0.35) {
    for (let i = 0; i < this.n; i++) {
      this.x[3 * i] = this.rest[3 * i];
      this.x[3 * i + 1] = this.rest[3 * i + 1] + drop;
      this.x[3 * i + 2] = this.rest[3 * i + 2];
    }
    this.prev.set(this.x);
    this.v.fill(0);
    this.endGrab();
  }

  // stiffness mapping: firmness 0..1 → edge compliance (log scale)
  shapeCompliance() { return Math.exp(Math.log(3.0) + (Math.log(0.05) - Math.log(3.0)) * this.firmness); }
  volCompliance() { return 1e-4 * (1 - 0.7 * this.firmness); }
  // damping 0..1 → rate (1/s) of relative-velocity decay along edges
  dampRate() { return 2 + 40 * this.damping * this.damping; }

  nudge(strength = 1) {
    // small hop with a twist — every particle gets v = v_lin + ω × (x − c)
    const c = this.centroid();
    const vy = 2.2 * strength, wx = 2.4 * strength, wz = -1.5 * strength, wy = 1.2 * strength;
    for (let i = 0; i < this.n; i++) {
      const rx = this.x[3 * i] - c[0], ry = this.x[3 * i + 1] - c[1], rz = this.x[3 * i + 2] - c[2];
      this.v[3 * i] += wy * rz - wz * ry;
      this.v[3 * i + 1] += vy + wz * rx - wx * rz;
      this.v[3 * i + 2] += wx * ry - wy * rx;
    }
  }

  centroid() {
    let x = 0, y = 0, z = 0, m = 0;
    for (let i = 0; i < this.n; i++) {
      const w = this.mass[i]; m += w;
      x += this.x[3 * i] * w; y += this.x[3 * i + 1] * w; z += this.x[3 * i + 2] * w;
    }
    return [x / m, y / m, z / m];
  }

  // ── grabbing ──
  beginGrab(hit, radius = 0.4) {
    this.grabN = 0;
    let nearest = -1, nd = Infinity;
    for (let i = 0; i < this.n; i++) {
      const d = Math.hypot(this.x[3 * i] - hit[0], this.x[3 * i + 1] - hit[1], this.x[3 * i + 2] - hit[2]);
      if (d < nd) { nd = d; nearest = i; }
    }
    const cg = nearest >= 0 ? this.comp[nearest] : 0;   // only the piece that was touched
    for (let i = 0; i < this.n; i++) {
      if (this.comp[i] !== cg) continue;
      const dx = this.x[3 * i] - hit[0], dy = this.x[3 * i + 1] - hit[1], dz = this.x[3 * i + 2] - hit[2];
      const d = Math.hypot(dx, dy, dz);
      if (d < radius) {
        const f = 1 - d / radius;
        const k = this.grabN++;
        this.grabIdx[k] = i; this.grabW[k] = f * f * (3 - 2 * f);
        this.grabOff[3 * k] = dx; this.grabOff[3 * k + 1] = dy; this.grabOff[3 * k + 2] = dz;
      }
    }
    if (this.grabN === 0 && nearest >= 0) {
      this.grabIdx[0] = nearest; this.grabW[0] = 1;
      this.grabOff[0] = this.x[3 * nearest] - hit[0]; this.grabOff[1] = this.x[3 * nearest + 1] - hit[1]; this.grabOff[2] = this.x[3 * nearest + 2] - hit[2];
      this.grabN = 1;
    }
    this.grabTarget.set(hit);
    this.grabPos.set(hit);
    this.grabStart = Float32Array.from(hit);
    this.grabRot.set([1, 0, 0, 0, 1, 0, 0, 0, 1]);
    this.grabbing = true;
  }
  moveGrab(target, rot) {
    this.grabTarget.set(target);
    // bounded reach: a strong stretch, never an unbounded one
    const dx = target[0] - this.grabStart[0], dy = target[1] - this.grabStart[1], dz = target[2] - this.grabStart[2];
    const d = Math.hypot(dx, dy, dz), maxReach = 2.2;
    if (d > maxReach) { const k = maxReach / d; this.grabTarget[0] = this.grabStart[0] + dx * k; this.grabTarget[1] = this.grabStart[1] + dy * k; this.grabTarget[2] = this.grabStart[2] + dz * k; }
    if (rot) this.grabRot.set(rot);
    // never drive the held patch into the floor: lift the whole patch instead of crushing it
    const R = this.grabRot;
    let lowest = Infinity;
    for (let k = 0; k < this.grabN; k++) lowest = Math.min(lowest, R[3] * this.grabOff[3 * k] + R[4] * this.grabOff[3 * k + 1] + R[5] * this.grabOff[3 * k + 2]);
    if (Number.isFinite(lowest)) this.grabTarget[1] = Math.max(this.grabTarget[1], this.floorY + 0.004 - lowest);
  }
  endGrab() { this.grabbing = false; this.grabN = 0; }

  // ── simulation ──
  step() {
    const sub = this.substeps;
    const dt = this.stepDt / sub;
    for (let s = 0; s < sub; s++) this.substep(dt);
    this.time += this.stepDt;
    // settling: once the jelly is nearly still, bleed off the last residual jitter
    if (!this.grabbing) {
      const ke = this.kineticEnergy() / this.totalMass; // ≈ ½ v²
      if (ke < 2e-3) {
        const f = Math.max(0.86, 1 - 0.14 * (1 - ke / 2e-3));
        for (let i = 0; i < this.v.length; i++) this.v[i] *= f;
      }
    }
    // safety: any non-finite value → reset gently
    for (let i = 0; i < this.x.length; i += 97) if (!Number.isFinite(this.x[i])) { this.reset(0.2); break; }
  }

  substep(dt) {
    const { x, prev, v, invMass, n } = this;
    const g = this.gravity * dt;
    // light air drag; while held, the hand steadies the jelly a little more
    const air = Math.exp(-(this.grabbing ? 2.5 : 0.08) * dt);
    for (let i = 0; i < n; i++) {
      const k = 3 * i;
      v[k + 1] += g;
      v[k] *= air; v[k + 1] *= air; v[k + 2] *= air;
      prev[k] = x[k]; prev[k + 1] = x[k + 1]; prev[k + 2] = x[k + 2];
      x[k] += v[k] * dt; x[k + 1] += v[k + 1] * dt; x[k + 2] += v[k + 2] * dt;
    }
    if (this.grabbing) this.solveGrab(dt);
    this.solveTets(dt);
    this.solveVolumes(dt);
    this.solveShape();
    if (this.nComp > 1 && (this.subIndex++ & 1) === 0) this.collidePieces();
    if (this.blade && this.blade.mode) this.solveBlade();
    this.solveFloor();
    const inv = 1 / dt, vmax = this.maxSpeed;
    for (let i = 0; i < 3 * n; i += 3) {
      let vx = (x[i] - prev[i]) * inv, vy = (x[i + 1] - prev[i + 1]) * inv, vz = (x[i + 2] - prev[i + 2]) * inv;
      const sp = Math.hypot(vx, vy, vz);
      if (sp > vmax) { const f = vmax / sp; vx *= f; vy *= f; vz *= f; }
      v[i] = vx; v[i + 1] = vy; v[i + 2] = vz;
    }
    this.dampEdges(dt);
  }

  // The visible knife. Before the cut it presses a rounded groove under its edge (the jelly
  // squashes before it gives); after the cut it wedges the two new faces apart as it sinks.
  solveBlade() {
    const b = this.blade, x = this.x, comp = this.comp, n = this.n;
    const px = b.p[0], py = b.p[1], pz = b.p[2];
    const dx = b.d[0], dz = b.d[2], nx = b.n[0], nz = b.n[2];
    const press = b.mode === 'press';
    const W = press ? 0.12 : b.halfGap, WP = 0.12;
    for (let i = 0; i < n; i++) {
      const k = 3 * i;
      const rx = x[k] - px, rz = x[k + 2] - pz;
      const along = rx * dx + rz * dz;
      if (along < b.a0 || along > b.a1) continue;
      const h = x[k + 1] - py;
      if (h > b.top) continue;
      const z = rx * nx + rz * nz, az = Math.abs(z);
      if (!press && az < WP) {
        // the cut lips stay held down at the depth of the break-through while the blade passes
        const hmax = b.holdY + 0.1 * (az / WP) * (az / WP);
        if (x[k + 1] > hmax) x[k + 1] = hmax;
      }
      if (az >= W) continue;
      if (press) {
        const hmax = 0.1 * (az / W) * (az / W);
        if (h > hmax) x[k + 1] = py + hmax;
      } else if (h > -0.03) {
        let s = b.side ? b.side[comp[i]] : 0;
        if (!s) s = z >= 0 ? 1 : -1;
        // eased: a few millimetres per substep, so the faces are wedged apart rather than kicked
        const push = Math.max(-0.003, Math.min(0.003, s * W - z));
        x[k] += nx * push; x[k + 2] += nz * push;
      }
    }
  }

  solveGrab(dt) {
    const { x, invMass } = this;
    const a = 2e-6 / (dt * dt);
    const R = this.grabRot, T = this.grabPos;
    // the hand cannot outrun the jelly: it follows the pointer at a bounded speed, so a flick of
    // the wrist pulls the piece along instead of whipping it into a knot
    {
      const G = this.grabTarget, gx = G[0] - T[0], gy = G[1] - T[1], gz = G[2] - T[2];
      const gl = Math.hypot(gx, gy, gz), f = Math.min(1, this.grabSpeed * dt / (gl || 1));
      T[0] += gx * f; T[1] += gy * f; T[2] += gz * f;
    }
    for (let k = 0; k < this.grabN; k++) {
      const i = this.grabIdx[k], w = invMass[i];
      const ox = this.grabOff[3 * k], oy = this.grabOff[3 * k + 1], oz = this.grabOff[3 * k + 2];
      const tx = T[0] + R[0] * ox + R[1] * oy + R[2] * oz;
      const ty = Math.max(T[1] + R[3] * ox + R[4] * oy + R[5] * oz, this.floorY + 0.005);
      const tz = T[2] + R[6] * ox + R[7] * oy + R[8] * oz;
      let f = this.grabW[k] * w / (w + a);
      // pressing down near the table: yield instead of crushing the jelly underneath
      if (ty < x[3 * i + 1] && ty < 0.45) f *= Math.max(0.12, ty / 0.45);
      x[3 * i] += (tx - x[3 * i]) * f;
      x[3 * i + 1] += (ty - x[3 * i + 1]) * f;
      x[3 * i + 2] += (tz - x[3 * i + 2]) * f;
    }
  }

  // Per-tet co-rotational shape matching: find the rotation that best maps the rest tet onto the
  // current one (Müller et al. 2016, warm-started quaternion), then pull the four corners toward the
  // rotated rest shape with XPBD compliance. Inverted tets are always pushed back to a proper shape.
  solveTets(dt) {
    const { x, tets, tetQ, tetRot: Q, tetFirm, mass } = this;
    const base = this.shapeCompliance() / (dt * dt);
    for (let t = 0; t < this.nT; t++) {
      const a = 3 * tets[4 * t], b = 3 * tets[4 * t + 1], c = 3 * tets[4 * t + 2], d = 3 * tets[4 * t + 3];
      const ma = mass[a / 3], mb = mass[b / 3], mc = mass[c / 3], md = mass[d / 3];
      const M = ma + mb + mc + md;
      const cx = (x[a] * ma + x[b] * mb + x[c] * mc + x[d] * md) / M;
      const cy = (x[a + 1] * ma + x[b + 1] * mb + x[c + 1] * mc + x[d + 1] * md) / M;
      const cz = (x[a + 2] * ma + x[b + 2] * mb + x[c + 2] * mc + x[d + 2] * md) / M;
      const T = 12 * t;
      // A = Σ m p qᵀ (mass-weighted covariance of current vs rest, both about their centroids)
      let f00 = 0, f01 = 0, f02 = 0, f10 = 0, f11 = 0, f12 = 0, f20 = 0, f21 = 0, f22 = 0;
      {
        let px = (x[a] - cx) * ma, py = (x[a + 1] - cy) * ma, pz = (x[a + 2] - cz) * ma;
        let q0 = tetQ[T], q1 = tetQ[T + 1], q2 = tetQ[T + 2];
        f00 += px * q0; f01 += px * q1; f02 += px * q2; f10 += py * q0; f11 += py * q1; f12 += py * q2; f20 += pz * q0; f21 += pz * q1; f22 += pz * q2;
        px = (x[b] - cx) * mb; py = (x[b + 1] - cy) * mb; pz = (x[b + 2] - cz) * mb; q0 = tetQ[T + 3]; q1 = tetQ[T + 4]; q2 = tetQ[T + 5];
        f00 += px * q0; f01 += px * q1; f02 += px * q2; f10 += py * q0; f11 += py * q1; f12 += py * q2; f20 += pz * q0; f21 += pz * q1; f22 += pz * q2;
        px = (x[c] - cx) * mc; py = (x[c + 1] - cy) * mc; pz = (x[c + 2] - cz) * mc; q0 = tetQ[T + 6]; q1 = tetQ[T + 7]; q2 = tetQ[T + 8];
        f00 += px * q0; f01 += px * q1; f02 += px * q2; f10 += py * q0; f11 += py * q1; f12 += py * q2; f20 += pz * q0; f21 += pz * q1; f22 += pz * q2;
        px = (x[d] - cx) * md; py = (x[d + 1] - cy) * md; pz = (x[d + 2] - cz) * md; q0 = tetQ[T + 9]; q1 = tetQ[T + 10]; q2 = tetQ[T + 11];
        f00 += px * q0; f01 += px * q1; f02 += px * q2; f10 += py * q0; f11 += py * q1; f12 += py * q2; f20 += pz * q0; f21 += pz * q1; f22 += pz * q2;
      }
      let qx = Q[4 * t], qy = Q[4 * t + 1], qz = Q[4 * t + 2], qw = Q[4 * t + 3];
      let r00, r01, r02, r10, r11, r12, r20, r21, r22;
      for (let it = 0; it < 2; it++) {
        r00 = 1 - 2 * (qy * qy + qz * qz); r01 = 2 * (qx * qy - qw * qz); r02 = 2 * (qx * qz + qw * qy);
        r10 = 2 * (qx * qy + qw * qz); r11 = 1 - 2 * (qx * qx + qz * qz); r12 = 2 * (qy * qz - qw * qx);
        r20 = 2 * (qx * qz - qw * qy); r21 = 2 * (qy * qz + qw * qx); r22 = 1 - 2 * (qx * qx + qy * qy);
        const ox = (r10 * f20 - r20 * f10) + (r11 * f21 - r21 * f11) + (r12 * f22 - r22 * f12);
        const oy = (r20 * f00 - r00 * f20) + (r21 * f01 - r01 * f21) + (r22 * f02 - r02 * f22);
        const oz = (r00 * f10 - r10 * f00) + (r01 * f11 - r11 * f01) + (r02 * f12 - r12 * f02);
        const den = Math.abs(r00 * f00 + r10 * f10 + r20 * f20 + r01 * f01 + r11 * f11 + r21 * f21 + r02 * f02 + r12 * f12 + r22 * f22) + 1e-12;
        const wx = ox / den, wy = oy / den, wz = oz / den;
        const w = Math.sqrt(wx * wx + wy * wy + wz * wz);
        if (w < 1e-6) break;
        // small-angle quaternion step (renormalised below); large jumps are clamped
        const sc = w > 1 ? 0.5 / w : 0.5;
        const ax = wx * sc, ay = wy * sc, az = wz * sc, cs = 1;
        const nx = cs * qx + ax * qw + ay * qz - az * qy;
        const ny = cs * qy - ax * qz + ay * qw + az * qx;
        const nz = cs * qz + ax * qy - ay * qx + az * qw;
        const nw = cs * qw - ax * qx - ay * qy - az * qz;
        const nl = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz + nw * nw);
        qx = nx * nl; qy = ny * nl; qz = nz * nl; qw = nw * nl;
      }
      r00 = 1 - 2 * (qy * qy + qz * qz); r01 = 2 * (qx * qy - qw * qz); r02 = 2 * (qx * qz + qw * qy);
      r10 = 2 * (qx * qy + qw * qz); r11 = 1 - 2 * (qx * qx + qz * qz); r12 = 2 * (qy * qz - qw * qx);
      r20 = 2 * (qx * qz - qw * qy); r21 = 2 * (qy * qz + qw * qx); r22 = 1 - 2 * (qx * qx + qy * qy);
      Q[4 * t] = qx; Q[4 * t + 1] = qy; Q[4 * t + 2] = qz; Q[4 * t + 3] = qw;
      // the same fraction for all four corners keeps linear and angular momentum intact
      const f = 1 / (1 + base * tetFirm[t] * M * 0.25);
      let q0 = tetQ[T], q1 = tetQ[T + 1], q2 = tetQ[T + 2];
      x[a] += (cx + r00 * q0 + r01 * q1 + r02 * q2 - x[a]) * f; x[a + 1] += (cy + r10 * q0 + r11 * q1 + r12 * q2 - x[a + 1]) * f; x[a + 2] += (cz + r20 * q0 + r21 * q1 + r22 * q2 - x[a + 2]) * f;
      q0 = tetQ[T + 3]; q1 = tetQ[T + 4]; q2 = tetQ[T + 5];
      x[b] += (cx + r00 * q0 + r01 * q1 + r02 * q2 - x[b]) * f; x[b + 1] += (cy + r10 * q0 + r11 * q1 + r12 * q2 - x[b + 1]) * f; x[b + 2] += (cz + r20 * q0 + r21 * q1 + r22 * q2 - x[b + 2]) * f;
      q0 = tetQ[T + 6]; q1 = tetQ[T + 7]; q2 = tetQ[T + 8];
      x[c] += (cx + r00 * q0 + r01 * q1 + r02 * q2 - x[c]) * f; x[c + 1] += (cy + r10 * q0 + r11 * q1 + r12 * q2 - x[c + 1]) * f; x[c + 2] += (cz + r20 * q0 + r21 * q1 + r22 * q2 - x[c + 2]) * f;
      q0 = tetQ[T + 9]; q1 = tetQ[T + 10]; q2 = tetQ[T + 11];
      x[d] += (cx + r00 * q0 + r01 * q1 + r02 * q2 - x[d]) * f; x[d + 1] += (cy + r10 * q0 + r11 * q1 + r12 * q2 - x[d + 1]) * f; x[d + 2] += (cz + r20 * q0 + r21 * q1 + r22 * q2 - x[d + 2]) * f;
    }
  }

  solveVolumes(dt) {
    const { x, invMass, tets, restVol } = this;
    const alpha0 = this.volCompliance() / (dt * dt);
    for (let t = 0; t < this.nT; t++) {
      const a = tets[4 * t], b = tets[4 * t + 1], c = tets[4 * t + 2], d = tets[4 * t + 3];
      const A = 3 * a, B = 3 * b, Cc = 3 * c, D = 3 * d;
      // gradients (Müller): g_a = (d-b)×(c-b), g_b = (c-a)×(d-a), g_c = (d-a)×(b-a), g_d = (b-a)×(c-a)
      const bax = x[B] - x[A], bay = x[B + 1] - x[A + 1], baz = x[B + 2] - x[A + 2];
      const cax = x[Cc] - x[A], cay = x[Cc + 1] - x[A + 1], caz = x[Cc + 2] - x[A + 2];
      const dax = x[D] - x[A], day = x[D + 1] - x[A + 1], daz = x[D + 2] - x[A + 2];
      const dbx = x[D] - x[B], dby = x[D + 1] - x[B + 1], dbz = x[D + 2] - x[B + 2];
      const cbx = x[Cc] - x[B], cby = x[Cc + 1] - x[B + 1], cbz = x[Cc + 2] - x[B + 2];
      const gax = dby * cbz - dbz * cby, gay = dbz * cbx - dbx * cbz, gaz = dbx * cby - dby * cbx;
      const gbx = cay * daz - caz * day, gby = caz * dax - cax * daz, gbz = cax * day - cay * dax;
      const gcx = day * baz - daz * bay, gcy = daz * bax - dax * baz, gcz = dax * bay - day * bax;
      const gdx = bay * caz - baz * cay, gdy = baz * cax - bax * caz, gdz = bax * cay - bay * cax;
      const V = (dax * gdx + day * gdy + daz * gdz) / 6;
      const wa = invMass[a], wb = invMass[b], wc = invMass[c], wd = invMass[d];
      const wsum = wa * (gax * gax + gay * gay + gaz * gaz) + wb * (gbx * gbx + gby * gby + gbz * gbz)
                 + wc * (gcx * gcx + gcy * gcy + gcz * gcz) + wd * (gdx * gdx + gdy * gdy + gdz * gdz);
      if (wsum < 1e-12) continue;
      const r0 = restVol[t];
      // anti-inversion: elements far below rest volume get a rigid (compliance-free) correction
      const alpha = V < 0.25 * r0 ? 0 : alpha0;
      const C = 6 * (V - r0);
      let s = -C / (wsum + alpha);
      x[A] += gax * s * wa; x[A + 1] += gay * s * wa; x[A + 2] += gaz * s * wa;
      x[B] += gbx * s * wb; x[B + 1] += gby * s * wb; x[B + 2] += gbz * s * wb;
      x[Cc] += gcx * s * wc; x[Cc + 1] += gcy * s * wc; x[Cc + 2] += gcz * s * wc;
      x[D] += gdx * s * wd; x[D + 1] += gdy * s * wd; x[D + 2] += gdz * s * wd;
    }
  }

  // Whole-piece shape memory: particles that have strayed far from where the piece's rest shape
  // would put them — laid over its own centroid and best-fit rotation — are drawn back toward it.
  // Within the slack nothing happens, so the wobble is untouched; but a thin piece that is
  // whipped about can no longer fold over on itself and crumple, which nothing else would stop
  // (there is no self-collision).
  solveShape() {
    const { x, rest, mass, comp, n, nComp, compMass, compRest, compRot: Q, compAcc: A } = this;
    const hold = this.shapeHold;
    if (hold <= 0) return;
    // per piece: centroid (0..2), then the covariance of current vs rest positions (3..11)
    A.fill(0);
    for (let i = 0; i < n; i++) {
      const o = 12 * comp[i], m = mass[i];
      A[o] += m * x[3 * i]; A[o + 1] += m * x[3 * i + 1]; A[o + 2] += m * x[3 * i + 2];
    }

      const dy = this.compC[3 * c + 1] + R[r + 3] * qx + R[r + 4] * qy + R[r + 5] * qz - x[3 * i + 1];

  // pieces push each other apart: particle spheres of different pieces may not overlap.

  collidePieces() {

        if (px < lo[0] || px > hi[0] || py < lo[1] || py > hi[1] || pz < lo[2] || pz > hi[2]) continue;

      }
      for (let i = 0; i < na; i++) {

  solveFloor() {
    const { x, prev, n } = this;

      const f = dl < mu * pen ? 1 : mu * pen / dl;

  dampEdges(dt) {
    const { x, v, invMass, edges } = this;
    const k = 1 - Math.exp(-this.dampRate() * dt);
    for (let e = 0; e < this.nE; e++) {
      const i = edges[2 * e], j = edges[2 * e + 1];
      const I = 3 * i, J = 3 * j;

    }
  }

  // ── diagnostics ──
  volumeRatio() {
    let s = 0;
    for (let t = 0; t < this.nT; t++) s += this.tetVol(this.x, t);
    return s / this.totalRestVolume;
  }
  minVolumeRatio() {
    let m = Infinity;
    for (let t = 0; t < this.nT; t++) m = Math.min(m, this.tetVol(this.x, t) / this.restVol[t]);
    return m;
  }
  kineticEnergy() {
    let e = 0;
    for (let i = 0; i < this.n; i++) {
      const k = 3 * i;

  meanStrain() {

function inv3(m) { // row-major 3x3
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;

}
